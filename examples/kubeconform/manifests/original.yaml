apiVersion: apps/v1
kind: Deployment
metadata:
  name: original-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: original-worker
  template:
    metadata:
      labels:
        app: original-worker
    spec:
      containers:
        - name: original-worker
          image: example.invalid/original-worker:1.0.0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: original-settings
data:
  original: "value"
