name: Native Windows resource qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resources:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Require original native execution and resource controls
        run: node scripts/verify-required-native-tests.mjs windows-process physical-process-output
      - name: Prepare pinned production package cache
        run: node scripts/prepare-package-cache.mjs
      - name: Require the same controls in a fresh offline production package
        run: node scripts/verify-windows-package.mjs
      - name: Remove and restore native resource guards
        run: node scripts/verify-windows-resource-guards.mjs
      - name: Remove and restore private namespace admission
        run: node scripts/verify-windows-workspace-guard.mjs
