name: Temporary consumer privacy diagnostic

on:
  push:
    branches:
      - "agent/ct-win-privacy-debug-1105"

permissions:
  contents: read

concurrency:
  group: consumer-privacy-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-privacy-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/ct-win-privacy-debug-1105'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 68ff3bd093cc2067b36dd0cecca0a43608bf09e8
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Observe only the current confidence lifecycle callback
        shell: pwsh
        env:
          CHECKTRAIL_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/checktrail-confidence-lifecycle-diagnostic.json
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE ".checktrail-confidence-lifecycle-diagnostic.mjs"
          @'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          import process from "node:process";
          const expectedSource = "68ff3bd093cc2067b36dd0cecca0a43608bf09e8";
          const expectedTree = "cfe05f6b38bd2b2bb1dd907001275e70f7509b13";
          const name = "confidence-provenance lifecycle acceptance";
          const file = "dist/test/gate-confidence-provenance.test.js";
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const git = (args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const count = (value) => Number.isSafeInteger(value) && value >= 0 && value <= 4096 ? value : null;
          let state = "incomplete", stage = "source-binding", sourceCommit = null, sourceTree = null;
          let compiledTestSha256 = null, callback = null, compiledBytesStable = false;
          try {
            sourceCommit = git(["rev-parse", "HEAD"]);
            sourceTree = git(["rev-parse", "HEAD^{tree}"]);
            if (sourceCommit !== expectedSource || sourceTree !== expectedTree ||
                git(["status", "--porcelain", "--untracked-files=no"]) !== "") throw Error("source-binding");
            if (process.platform !== "win32" || process.arch !== "x64" || process.versions.node !== "22.23.3") throw Error("runtime-binding");
            const before = await readFile(file);
            if (before.length > 4 * 1048576) throw Error("source-bound");
            compiledTestSha256 = hash(before);
            const { runRequiredTests } = await import("./scripts/required-test-evidence.mjs");
            stage = "lifecycle-observation";
            const profile = await runRequiredTests([{ file: path.resolve(file), name }], {
              timeoutMs: 600000, isolatedCaseWorkers: 1, diagnosticSourceFile: path.resolve(file),
            });
            compiledBytesStable = hash(await readFile(file)) === compiledTestSha256;
            const row = profile.ledger?.cases?.find((item) => item.name === name);
            const problems = (profile.problems ?? []).filter((problem) => problem.name === name);
            const sites = problems.filter((problem) => problem.failureSite?.sourceFileSha256 === compiledTestSha256)
              .map((problem) => ({ sourceFileSha256: compiledTestSha256,
                line: count(problem.failureSite.line), column: count(problem.failureSite.column) }));
            callback = {
              name, required: count(profile.required), passed: count(profile.passed), complete: profile.complete === true,
              outcome: ["passed", "failed", "skipped", "todo", "missing"].includes(row?.outcome) ? row.outcome : null,
              terminalEventCount: count(profile.ledger?.terminalEventCount), truncated: profile.ledger?.truncated === true,
              failureSites: sites.slice(0, 4),
              problemReasons: problems.slice(0, 8).map((problem) =>
                ["failed", "skipped-or-todo", "required-test-not-passed"].includes(problem.reason) ? problem.reason : "other"),
            };
            state = compiledBytesStable && callback.required === 1 && callback.outcome !== null ? "observed" : "incomplete";
            process.exitCode = state === "observed" && callback.outcome === "passed" ? 0 : 1;
          } catch {
            process.exitCode = 1;
          }
          const output = {
            schemaVersion: 1, profile: "confidence-lifecycle-diagnostic-only-v1", state, stage,
            diagnosticWorkflowCommit: process.env.GITHUB_SHA ?? null,
            sourceCommit, sourceTree, compiledTestSha256, compiledBytesStable, callback,
            runtime: { node: process.versions.node, platform: process.platform, architecture: process.arch },
            acceptanceClaim: false, gateAClosed: false, inferenceExecuted: false, fieldEvaluationExecuted: false,
          };
          try { await writeFile(process.env.CHECKTRAIL_DIAGNOSTIC_OUTPUT, JSON.stringify(output) + "\n", { flag: "wx" }); }
          catch { process.exitCode = 1; }
          process.stdout.write(JSON.stringify(output) + "\n");
          '@ | Set-Content -LiteralPath $diagnosticScript -Encoding utf8
          $diagnosticExit = 1
          try {
            node $diagnosticScript
            $diagnosticExit = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $diagnosticScript -Force
          }
          if ($diagnosticExit -ne 0) { exit $diagnosticExit }
      - name: Retain only the sanitized confidence diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: confidence-lifecycle-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checktrail-confidence-lifecycle-diagnostic.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
