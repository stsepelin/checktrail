name: Windows Git metadata diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr150-windows-git-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-package-cache.mjs
      - name: Observe actual Windows Git discovery and fixed read-only metadata
        run: node scripts/probe-windows-git.mjs
      - name: Require current and legacy metadata selection controls
        run: node --test --test-name-pattern="Windows metadata" dist/test/git-metadata-policy.test.js
      - name: Measure the original installed package cohort directly
        run: node scripts/verify-consumer-impact-whole-package.mjs
        env:
          CHECKTRAIL_CONSUMER_RUNTIME_ACTIVE: "1"
          CHECKTRAIL_CONSUMER_RUNTIME_SLOT: windows-node22
