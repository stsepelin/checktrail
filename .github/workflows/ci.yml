name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust198-host-metadata-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust198-host-metadata:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact first-party read-only metadata controller
        shell: bash
        env:
          COHORT_SHA256: c48cc0c015298326330528965447e5645c79bd97fe7988923dd1b9d7a439a1dc
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/.github/native-rust198"
          control="$RUNNER_TEMP/checktrail-rust198-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$control"
          sudo /usr/bin/python3 -I -B - "$source_dir" "$control" "$COHORT_SHA256" <<'PYINSTALL'
          from pathlib import Path
          import hashlib,json,os,re,stat,sys
          source,dest,expected=Path(sys.argv[1]).resolve(strict=True),Path(sys.argv[2]),sys.argv[3]
          assert not os.path.lexists(dest) and dest.parent==dest.parent.resolve(strict=True)
          manifest=source/'PUBLIC-COHORT.json';body=manifest.read_bytes()
          assert len(body)<=1048576 and hashlib.sha256(body).hexdigest()==expected
          rows=json.loads(body);names=set();inputs=[]
          for row in rows:
              name=row['file']
              assert re.fullmatch('[a-zA-Z0-9_./-]+',name) and not name.startswith('/') and all(x not in ('','.','..') for x in name.split('/')) and name not in names
              names.add(name);p=source/name;s=p.lstat()
              assert p==p.resolve(strict=True) and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_size==row['bytes']
              b=p.read_bytes();assert hashlib.sha256(b).hexdigest()==row['sha256'];inputs.append((name,b))
          dest.mkdir(mode=0o700)
          for name,b in inputs+[('PUBLIC-COHORT.json',body)]:
              p=dest/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);p.chmod(0o444)
          for p in dest.rglob('*'):
              if p.is_dir():p.chmod(0o555)
          dest.chmod(0o555)
          sys.path.insert(0,str(dest));import launch
          launch.verify(dest,dest/'PUBLIC-COHORT.json',expected)
          PYINSTALL
      - name: Synthetic controls against the read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/checktrail-rust198-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/python3 -I -B -m unittest discover -s "$control" -p 'test_*.py' -v
      - name: Observe selected host and original SLA metadata only
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/checktrail-rust198-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          output="$RUNNER_TEMP/checktrail-rust198-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin             GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted             GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA"             CHECKTRAIL_CONTROLLER_UID="$(id -u)"             /usr/bin/python3 -I -B "$control/host_probe.py" "$output"
