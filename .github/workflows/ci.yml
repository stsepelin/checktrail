name: SDK10 rolling retention synthetic
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Exact operator nonce for this synthetic-only trial
        required: true
        type: string
permissions:
  actions: read
concurrency:
  group: sdk10-rolling-retention-synthetic
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRIAL_NONCE: ${{ inputs.nonce }}
      TRIAL_WORKFLOW: .github/workflows/ci.yml
    steps:
      - name: Materialize only the first-party deterministic synthetic helper
        shell: bash
        run: |
          TRIAL_ROOT="$RUNNER_TEMP/ct-sdk10-synthetic"
          export TRIAL_ROOT
          printf 'TRIAL_ROOT=%s\n' "$TRIAL_ROOT" >> "$GITHUB_ENV"
          python3 -I -B - <<'PY_HELPER'
          import base64,hashlib,os,pathlib
          import zlib
          d=zlib.decompressobj()
          b=d.decompress(base64.b64decode(""),16587)
          assert len(b)==16586 and d.eof and not d.unused_data and not d.unconsumed_tail
          assert hashlib.sha256(b).hexdigest()=="be28e89724a7877e68b854239b445a466746058f6a98f68ab21b1f9b67aec5f6"
          p=pathlib.Path(os.environ['TRIAL_ROOT']);p.mkdir(mode=0o700)
          f=p/'rolling.py';f.write_bytes(b);f.chmod(0o400)
          PY_HELPER
          python3 -I -B "$TRIAL_ROOT/rolling.py" generate --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/parts" --seconds 60
      - name: Upload owned synthetic part one
        id: first
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000001
          path: ${{ env.TRIAL_ROOT }}/parts/1/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload owned synthetic part two
        id: second
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000002
          path: ${{ env.TRIAL_ROOT }}/parts/2/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Record the exact two-slot backpressure snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.first.outputs.artifact-id }}
          SECOND_ID: ${{ steps.second.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/rolling.py" record --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 60
      - name: Wait for the locally verified first deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.first.outputs.artifact-id }}
          SECOND_ID: ${{ steps.second.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/rolling.py" wait --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 600
      - name: Upload the post-backpressure one-KiB sentinel with actual gate metadata
        id: third
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000003
          path: ${{ env.TRIAL_ROOT }}/parts/3/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
