name: Native candidate acceptance
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
concurrency:
  group: native-candidate-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate-windows-provenance:
    name: Candidate Windows original provenance source and fresh controls
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d6fe2c2024367315a992ad9dc753ef1957e39d5c
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Diagnose native Windows private-access setup boundaries
        run: node scripts/diagnose-windows-task-access.mjs
      - run: node scripts/prepare-package-cache.mjs
      - name: Require actual nested stage timeout and parent-loss ownership
        timeout-minutes: 3
        shell: pwsh
        run: |
          node --test --test-reporter=tap '--test-name-pattern=^provenance stage owner (timeout|parent loss) reaps nested file descendants and preserves an unrelated sibling$' dist/test/native-provenance-runtime.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $entry = Join-Path $env:RUNNER_TEMP 'checktrail-provenance-owner-controls.mjs'
          @'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { runRequiredTests } = await import(pathToFileURL(path.resolve('scripts/required-test-evidence.mjs')).href);
          const names = [
            'provenance stage owner timeout reaps nested file descendants and preserves an unrelated sibling',
            'provenance stage owner parent loss reaps nested file descendants and preserves an unrelated sibling',
          ];
          const evidence = await runRequiredTests(names.map(name => ({file: 'dist/test/native-provenance-runtime.test.js', name})), {timeoutMs: 120000, isolatedCaseWorkers: 1});
          console.log(JSON.stringify({schemaVersion: 1, status: 'observed-required-owner-evidence', evidence}));
          assert.equal(evidence.required, 2);
          assert.equal(evidence.complete, true, JSON.stringify(evidence.problems));
          assert.deepEqual(evidence.ledger.cases.map(({name, outcome}) => ({name, outcome})), names.map(name => ({name, outcome: 'passed'})));
          console.log(JSON.stringify({schemaVersion: 1, status: 'passed-original-nested-stage-owner-controls', evidence}));
          '@ | Set-Content -LiteralPath $entry -Encoding utf8
          node $entry
      - name: Require provenance composition from source and a fresh offline package
        id: native-provenance-runtime
        timeout-minutes: 30
        run: node scripts/verify-native-provenance-runtime.mjs windows-node22
        env:
          CHECKTRAIL_NATIVE_PROVENANCE_RUNTIME_RECEIPT: ${{ runner.temp }}${{ runner.os == 'Windows' && '\' || '/' }}native-provenance-runtime.json
      - name: Retain original bounded provenance runtime receipt bytes
        if: ${{ !cancelled() && steps.native-provenance-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-native-provenance-windows-node22-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}${{ runner.os == 'Windows' && '\' || '/' }}native-provenance-runtime.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
