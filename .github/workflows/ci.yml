name: Native resource diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-upgrade:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/prepare-package-cache.mjs
      - run: node scripts/prepare-release-readiness-tools.mjs
      - run: node scripts/diagnose-windows-upgrade.mjs
