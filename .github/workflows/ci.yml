name: Windows Git metadata diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr150-windows-git-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Observe actual Windows Git discovery and fixed read-only metadata
        run: node scripts/probe-windows-git.mjs
