name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust198-host-metadata-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust198-host-metadata:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact first-party controller in fresh protected namespace
        shell: bash
        env:
          COHORT_SHA256: 4a1ec9126b83409ca8d8707f218a3f3d0e5b78fc2ef0a8e2e1f4835ef3f02a99
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/.github/native-rust198"
          placements=$(sudo /usr/bin/env GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" /usr/bin/python3 -I -B - "$source_dir" "$COHORT_SHA256" <<'PYINSTALL'
          from pathlib import Path
          import hashlib,json,os,re,stat,sys,types
          source,expected=Path(sys.argv[1]).resolve(strict=True),sys.argv[2]
          body=(source/'PUBLIC-COHORT.json').read_bytes()
          assert len(body)<=1048576 and hashlib.sha256(body).hexdigest()==expected
          rows=json.loads(body);names=set();inputs=[]
          for row in rows:
              name=row['file']
              assert re.fullmatch('[a-zA-Z0-9_./-]+',name) and not name.startswith('/') and all(x not in ('','.','..') for x in name.split('/')) and name not in names
              names.add(name);p=source/name;s=p.lstat()
              assert p==p.resolve(strict=True) and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_size==row['bytes']
              raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==row['sha256'];inputs.append((name,raw))
          assert 'placement.py' in names
          # Execute only the hash-verified first-party placement module. No
          # repository/project/SDK code is imported by this root startup.
          placement=types.ModuleType('verified_firstparty_placement')
          exec(compile(next(raw for name,raw in inputs if name=='placement.py'),'<verified-firstparty-placement>','exec'),placement.__dict__)
          context={k:os.environ[k] for k in ['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA']}
          paths=placement.create_namespace(context);dest=paths['controller'];dest.mkdir(mode=0o700)
          for name,raw in inputs+[('PUBLIC-COHORT.json',body)]:
              p=dest/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw);p.chmod(0o444)
          for p in dest.rglob('*'):
              if p.is_dir():p.chmod(0o555)
          dest.chmod(0o555)
          sys.path.insert(0,str(dest));import launch
          launch.verify(dest,dest/'PUBLIC-COHORT.json',expected)
          for name,key in [('CHECKTRAIL_RUST198_CONTROL','controller'),('CHECKTRAIL_RUST198_HOST','host'),('CHECKTRAIL_RUST198_NATIVE_WORK','nativeWork')]:
              value=str(paths[key]);assert '\n' not in value and '\r' not in value;print(name+'='+value)
          PYINSTALL
          )
          printf '%s\n' "$placements" >> "$GITHUB_ENV"
      - name: Synthetic controls against the read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B -m unittest discover -s "$CHECKTRAIL_RUST198_CONTROL" -p 'test_*.py' -v
      - name: Observe selected host and original SLA metadata only
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" CHECKTRAIL_CONTROLLER_UID="$(id -u)" /usr/bin/python3 -I -B "$CHECKTRAIL_RUST198_CONTROL/host_probe.py" "$CHECKTRAIL_RUST198_HOST"
