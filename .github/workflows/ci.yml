name: Focused Tasks admission diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tasks-admission:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Original task private-access diagnostic
        run: node scripts/diagnose-windows-task-access.mjs
      - run: node scripts/prepare-package-cache.mjs
      - name: Trace original source and offline installed Tasks cohort without relaxing assertions
        run: node scripts/verify-tasks-runtime.mjs windows-node22
