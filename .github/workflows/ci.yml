name: SDK10 parallel rolling retention synthetic
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Exact operator nonce for this synthetic-only trial
        required: true
        type: string
permissions:
  actions: read
concurrency:
  group: sdk10-parallel-rolling-retention-synthetic
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRIAL_NONCE: ${{ inputs.nonce }}
      TRIAL_WORKFLOW: .github/workflows/ci.yml
    steps:
      - name: Materialize only the first-party deterministic synthetic helper
        shell: bash
        run: |
          TRIAL_ROOT="$RUNNER_TEMP/ct-sdk10-parallel-synthetic"
          export TRIAL_ROOT
          printf 'TRIAL_ROOT=%s\n' "$TRIAL_ROOT" >> "$GITHUB_ENV"
          python3 -I -B - <<'PY_HELPER'
          import base64,hashlib,os,pathlib,zlib
          raw=base64.b64decode("",validate=True)
          assert len(raw)<=16384
          d=zlib.decompressobj();b=d.decompress(raw,25234)
          assert len(b)==25233 and d.eof and not d.unused_data and not d.unconsumed_tail
          assert hashlib.sha256(b).hexdigest()=="c51243007d42ab77ca36cf64cdfa629f067f676b9e9259ed970c46a3e48b869e"
          p=pathlib.Path(os.environ['TRIAL_ROOT']);p.mkdir(mode=0o700)
          f=p/'parallel.py';f.write_bytes(b);f.chmod(0o400)
          PY_HELPER
          python3 -I -B "$TRIAL_ROOT/parallel.py" generate --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/parts" --seconds 60
      - name: Upload owned synthetic part 1
        id: part1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000001
          path: ${{ env.TRIAL_ROOT }}/parts/1/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload owned synthetic part 2
        id: part2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000002
          path: ${{ env.TRIAL_ROOT }}/parts/2/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Record exact two-slot backpressure window 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.part1.outputs.artifact-id }}
          SECOND_ID: ${{ steps.part2.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/parallel.py" record --window 1 --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate-1" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 60
      - name: Wait for both locally verified deletions window 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.part1.outputs.artifact-id }}
          SECOND_ID: ${{ steps.part2.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/parallel.py" wait --window 1 --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate-1" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 600
      - name: Upload owned synthetic part 3
        id: part3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000003
          path: ${{ env.TRIAL_ROOT }}/parts/3/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload owned synthetic part 4
        id: part4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000004
          path: ${{ env.TRIAL_ROOT }}/parts/4/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Record exact two-slot backpressure window 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.part3.outputs.artifact-id }}
          SECOND_ID: ${{ steps.part4.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/parallel.py" record --window 2 --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate-2" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 60
      - name: Wait for both locally verified deletions window 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.part3.outputs.artifact-id }}
          SECOND_ID: ${{ steps.part4.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/parallel.py" wait --window 2 --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate-2" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 600
      - name: Upload owned synthetic part 5
        id: part5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000005
          path: ${{ env.TRIAL_ROOT }}/parts/5/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload owned synthetic part 6
        id: part6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-rolling-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.nonce }}-000006
          path: ${{ env.TRIAL_ROOT }}/parts/6/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Record exact two-slot backpressure window 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.part5.outputs.artifact-id }}
          SECOND_ID: ${{ steps.part6.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/parallel.py" record --window 3 --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate-3" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 60
      - name: Wait for both locally verified deletions window 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_ID: ${{ steps.part5.outputs.artifact-id }}
          SECOND_ID: ${{ steps.part6.outputs.artifact-id }}
        run: |
          python3 -I -B "$TRIAL_ROOT/parallel.py" wait --window 3 --nonce "$TRIAL_NONCE" --out "$TRIAL_ROOT/gate-3" --parts "$TRIAL_ROOT/parts" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA" --workflow "$TRIAL_WORKFLOW" --ids "$FIRST_ID,$SECOND_ID" --seconds 600
