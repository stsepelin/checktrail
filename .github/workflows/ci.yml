name: Manual cleanup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-cleanup-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Repeat original lifecycle callback with bounded cleanup diagnostics
        run: node scripts/diagnose-lifecycle-cleanup.mjs
