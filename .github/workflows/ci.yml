# FIRST-PARTY CONTROLS ONLY. No original SDK/source/key/export execution.
name: SDK10 owned pause controls
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Exact reviewed fresh controls-only nonce
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: checktrail-sdk10-owned-pause-controls
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    env:
      CHECKTRAIL_NONCE: ${{ inputs.nonce }}
      CHECKTRAIL_MANIFEST_SHA256: 7a33f178024b9307429aa4075aa6e5ce7ce11b5c18f32924614feba09128fc04
    steps:
      - name: Read exact reviewed first-party source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Focused first-party synthetic controls without keys or Docker
        shell: bash
        run: |
          python3 -I -S -B scripts/producer-sdk10/test_producer_pause.py
          python3 -I -S -B scripts/producer-sdk10/test_producer_adapter.py
          python3 -I -S -B scripts/producer-sdk10/test_live_resource.py
          python3 -I -S -B scripts/producer-sdk10/test_target_pause_controls.py
      - name: Actual owned inert Docker pause and strict sampler controls
        shell: bash
        run: python3 -I -S -B scripts/producer-sdk10/target_pause_controls.py --nonce "$CHECKTRAIL_NONCE" --manifest-sha256 "$CHECKTRAIL_MANIFEST_SHA256"
      - name: Retain finite first-party controls metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk10-owned-pause-controls-${{ github.run_id }}-1-${{ inputs.nonce }}
          path: ${{ runner.temp }}/ct-sdk10-controls-${{ inputs.nonce }}/RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
