name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust198-lifecycle-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust198-lifecycle-controls:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact read-only first-party lifecycle controls
        shell: bash
        env:
          COHORT_SHA256: 69dc32c3675dc04d94d97ddfeefb43e133a7f97b9e75f85827334f89141dbff2
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/.github/native-rust198-lifecycle"
          control="$RUNNER_TEMP/checktrail-rust198-lifecycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo /usr/bin/python3 -I -B - "$source_dir" "$control" "$COHORT_SHA256" <<'PYINSTALL'
          from pathlib import Path
          import hashlib,json,os,stat,sys
          source,dest,expected=Path(sys.argv[1]).resolve(strict=True),Path(sys.argv[2]),sys.argv[3]
          assert not os.path.lexists(dest) and dest.parent==dest.parent.resolve(strict=True)
          body=(source/'LIFECYCLE-COHORT.json').read_bytes()
          assert len(body)<=4096 and hashlib.sha256(body).hexdigest()==expected
          rows=json.loads(body);assert len(rows)==2 and {r['file'] for r in rows}=={'process_supervisor.py','test_process_lifecycle.py'}
          inputs=[]
          for row in rows:
              file=source/row['file'];s=file.lstat()
              assert file==file.resolve(strict=True) and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_size==row['bytes'] and s.st_size<=131072
              raw=file.read_bytes();assert hashlib.sha256(raw).hexdigest()==row['sha256'];inputs.append((row['file'],raw))
          dest.mkdir(mode=0o700)
          for name,raw in inputs+[('LIFECYCLE-COHORT.json',body)]:
              file=dest/name;file.write_bytes(raw);file.chmod(0o444)
          dest.chmod(0o555)
          PYINSTALL
      - name: Run only bounded real synthetic process lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/checktrail-rust198-lifecycle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" /usr/bin/python3 -I -B - "$control" <<'PYCONTROLS'
          from pathlib import Path
          import hashlib,json,os,platform,signal,sys,time,unittest
          started=time.monotonic()
          signal.signal(signal.SIGALRM,lambda *_:(_ for _ in ()).throw(TimeoutError('First-party controls deadline')));signal.alarm(240)
          assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
          assert platform.system()=='Darwin' and platform.machine()=='arm64' and platform.mac_ver()[0].split('.')[0]=='15'
          control=Path(sys.argv[1]);body=(control/'LIFECYCLE-COHORT.json').read_bytes()
          assert hashlib.sha256(body).hexdigest()=='69dc32c3675dc04d94d97ddfeefb43e133a7f97b9e75f85827334f89141dbff2'
          for row in json.loads(body):
              file=control/row['file'];assert hashlib.sha256(file.read_bytes()).hexdigest()==row['sha256']
          sys.path.insert(0,str(control));import test_process_lifecycle as cases
          result=unittest.TextTestRunner(stream=sys.stderr,verbosity=2).run(unittest.defaultTestLoader.loadTestsFromTestCase(cases.LifecycleTests))
          value={'scope':'first-party synthetic Python children and OS process metadata only','testsRun':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'elapsedSeconds':time.monotonic()-started,'host':{'platform':platform.system(),'macOS':platform.mac_ver()[0],'arch':platform.machine()},'runContext':{k:os.environ[k] for k in ['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA']},'actualObservations':cases.OBSERVATIONS,'originalSDKCompilerProjectArchiveDockerKeyUploadOrModelExecuted':False,'nativeAdmissionGranted':False}
          encoded=json.dumps(value,sort_keys=True).encode();assert len(encoded)<=1048576 and time.monotonic()-started<240
          print(encoded.decode(),flush=True);signal.alarm(0)
          sys.exit(0 if result.testsRun==17 and result.wasSuccessful() and not result.skipped else 1)
          PYCONTROLS
