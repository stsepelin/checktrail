          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned public images with bounded delivery retries
        run: |
          node scripts/pull-pinned-image.mjs docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned Clang fixture
        run: docker build --file scripts/clang-tools.Dockerfile --tag checktrail-clang-test:22.1.3 scripts
      - run: node scripts/verify-clang-container.mjs

  java:
    needs: [ci-plan, actionlint]
    if: ${{ always() && !cancelled() && (needs.ci-plan.result != 'success' || fromJSON(needs.ci-plan.outputs.plan).selected['java']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
