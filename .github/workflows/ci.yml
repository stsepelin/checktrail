          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned public images with bounded delivery retries
        run: |
          node scripts/pull-pinned-image.mjs docker.io/library/eclipse-temurin@sha256:541729c21f9308a68cebbe5a0627e4cd465dfe8980fc03bac0b2feaee57daafd
          node scripts/pull-pinned-image.mjs docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned Java fixture
        run: docker build --file scripts/java-tools.Dockerfile --tag checktrail-java-test:25.0.4 scripts
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-java-container.mjs

  checkstyle:
    needs: [ci-plan, actionlint]
    if: ${{ always() && !cancelled() && (needs.ci-plan.result != 'success' || fromJSON(needs.ci-plan.outputs.plan).selected['checkstyle']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned Checkstyle artifact
        run: node scripts/prepare-java-review-tools.mjs
      - name: Prepare pinned public images with bounded delivery retries
        run: |
          node scripts/pull-pinned-image.mjs docker.io/library/eclipse-temurin@sha256:541729c21f9308a68cebbe5a0627e4cd465dfe8980fc03bac0b2feaee57daafd
          node scripts/pull-pinned-image.mjs docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned Checkstyle runtime
        run: docker build --file scripts/java-review-tools.Dockerfile --tag checktrail-checkstyle-test:14.3.0 .checktrail/jvm-review-tools
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-checkstyle-container.mjs

  spotbugs:
