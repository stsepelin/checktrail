name: Npm notice diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-notice-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  npm-notices:
    name: npm-notices (${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - slot: ci-linux-node22
            os: ubuntu-24.04
            node: "22.23.3"
            platform: linux
            arch: x64
          - slot: ci-linux-node24
            os: ubuntu-24.04
            node: "24.21.0"
            platform: linux
            arch: x64
          - slot: ci-linux-node26
            os: ubuntu-24.04
            node: "26.10.0"
            platform: linux
            arch: x64
          - slot: ci-macos-node22
            os: macos-26
            node: "22.23.3"
            platform: darwin
            arch: arm64
          - slot: ci-macos-node24
            os: macos-26
            node: "24.20.0"
            platform: darwin
            arch: arm64
          - slot: ci-macos-node26
            os: macos-26
            node: "26.9.0"
            platform: darwin
            arch: arm64
          - slot: windows-node22
            os: windows-2025
            node: "22.23.3"
            platform: win32
            arch: x64
    env:
      CHECKTRAIL_NPM_SLOT: ${{ matrix.slot }}
      CHECKTRAIL_NPM_EXPECTED_NODE: ${{ matrix.node }}
      CHECKTRAIL_NPM_EXPECTED_PLATFORM: ${{ matrix.platform }}
      CHECKTRAIL_NPM_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/diagnostic-npm-runtime.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Exercise original audit and new platform regressions
        shell: bash
        run: node --test --test-name-pattern="dependency audit reconciles installed metadata|Linux development audit excludes libc-specific|audit libc observation|development audit rejects malformed libc" dist/test/dependency-audit.test.js dist/test/development-dependency-audit.test.js
      - name: Audit actual installed production and development notices
        shell: bash
        run: node scripts/audit-dependencies.mjs --include-dev > npm-notice-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-notices-${{ matrix.slot }}
          path: |
            npm-notice-runtime.json
            npm-notice-audit.json
          if-no-files-found: error
          retention-days: 30
  npm-notices-arm64:
    name: npm-notices (native-linux-arm64-node22)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CHECKTRAIL_NPM_SLOT: native-linux-arm64-node22
      CHECKTRAIL_NPM_EXPECTED_NODE: "22.23.2"
      CHECKTRAIL_NPM_EXPECTED_PLATFORM: linux
      CHECKTRAIL_NPM_EXPECTED_ARCH: arm64
      CHECKTRAIL_NPM_CONTAINER_REFERENCE: docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact native container and audit its installed npm scope
        shell: bash
        run: |
          docker pull "$CHECKTRAIL_NPM_CONTAINER_REFERENCE"
          CHECKTRAIL_NPM_CONTAINER_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$CHECKTRAIL_NPM_CONTAINER_REFERENCE")
          export CHECKTRAIL_NPM_CONTAINER_IMAGE_ID
          docker run --rm --cpus 2 --memory 4g \
            --mount "type=bind,src=$PWD,target=/app" --workdir /app \
            -e GITHUB_SHA -e ImageOS -e ImageVersion \
            -e CHECKTRAIL_NPM_SLOT -e CHECKTRAIL_NPM_EXPECTED_NODE \
            -e CHECKTRAIL_NPM_EXPECTED_PLATFORM -e CHECKTRAIL_NPM_EXPECTED_ARCH \
            -e CHECKTRAIL_NPM_CONTAINER_REFERENCE -e CHECKTRAIL_NPM_CONTAINER_IMAGE_ID \
            "$CHECKTRAIL_NPM_CONTAINER_REFERENCE" sh -c \
            'node scripts/diagnostic-npm-runtime.mjs && npm ci --ignore-scripts --no-audit --no-fund && node --max-old-space-size=2048 node_modules/typescript/bin/tsc && node --test --test-name-pattern="dependency audit reconciles installed metadata|Linux development audit excludes libc-specific|audit libc observation|development audit rejects malformed libc" dist/test/dependency-audit.test.js dist/test/development-dependency-audit.test.js && node scripts/audit-dependencies.mjs --include-dev > npm-notice-audit.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-notices-native-linux-arm64-node22
          path: |
            npm-notice-runtime.json
            npm-notice-audit.json
          if-no-files-found: error
          retention-days: 30
