# Review-only replacement for ci.yml on a manual diagnostic/* branch.
# Workflow ID 363121286 remains the already registered carrier; no PR stack.
name: GCC stock-runner capacity probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gcc-staged-capacity-probe
  cancel-in-progress: false
jobs:
  gcc-staged-first:
    if: github.repository == 'stsepelin/checktrail' && startsWith(github.ref, 'refs/heads/diagnostic/')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Read stock host and GitHub service capacity only
        timeout-minutes: 3
        env:
          CHECKTRAIL_GITHUB_JOB_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B scripts/producer-qualification/gcc-hosted-capacity.py
          --output "$RUNNER_TEMP/gcc-stock-capacity"
      - name: Retain bounded capacity observations and unavailable causes
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-stock-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gcc-stock-capacity
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
