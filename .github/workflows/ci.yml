name: Pinned Python 3.13.5 compatibility on Ubuntu 26 ARM
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python3135-ubuntu26-arm64-compatibility
  cancel-in-progress: false
jobs:
  python-sdk-compatibility:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
      - name: Prepare the exact Ubuntu24-produced SDK and observe native ABI compatibility
        timeout-minutes: 5
        run: node scripts/prepare-python-host-sdk.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.5"
      - name: Verify the unchanged setup action selects the prepared interpreter
        timeout-minutes: 1
        run: |
          python3 -I -B - <<'PY'
          import hashlib,json,os,platform,sys
          from pathlib import Path
          pin=json.loads(Path('scripts/python-ubuntu26-arm64.json').read_text())
          executable=Path(sys.executable).resolve(strict=True)
          assert sys.version_info[:3]==(3,13,5) and platform.machine()=='aarch64'
          assert hashlib.sha256(executable.read_bytes()).hexdigest()==pin['interpreterSHA256']
          assert executable==(Path(os.environ['pythonLocation'])/'bin/python3.13').resolve(strict=True)
          metadata={'sourceCommit':os.environ['GITHUB_SHA'],'hostImageOS':os.environ['ImageOS'],'hostImageVersion':os.environ['ImageVersion'],'sdkProducerOS':pin['producerOS'],'version':platform.python_version(),'interpreterSHA256':pin['interpreterSHA256'],'setupActionSelectedPreparedSDK':True,'upstreamInstallerExecuted':False,'publisherUbuntu26SupportClaimed':False,'upstreamBuildReproduced':False,'modelOrFieldTrialInvoked':False}
          Path(os.environ['RUNNER_TEMP'],'python3135-after-setup.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Retain scoped compatibility metadata
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python3135-ubuntu26-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /opt/hostedtoolcache/Python/3.13.5/arm64-preparation.json
            ${{ runner.temp }}/python3135-after-setup.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
