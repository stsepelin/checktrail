# DIAGNOSTIC PROPOSAL ONLY. Do not replace ordinary main CI with this file.
name: SDK10 original producer diagnostic
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Exact reviewed fresh lowercase nonce
        required: true
        type: string
      operator_ack:
        description: sdk10-original-e34-240m-e5a8e59244f4
        required: true
        type: string
      recipient_jwk:
        description: RSA3072..4096 public-only JWK; private key remains local
        required: true
        type: string
      ack_parent:
        description: Exact preexisting dedicated diagnostic recovery-ref commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: checktrail-sdk10-original-manual
  cancel-in-progress: false
jobs:
  sdk10-original:
    name: sdk10-original
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      CHECKTRAIL_NONCE: ${{ inputs.nonce }}
      CHECKTRAIL_OPERATOR_ACK: ${{ inputs.operator_ack }}
      CHECKTRAIL_RECIPIENT_JWK: ${{ inputs.recipient_jwk }}
      CHECKTRAIL_ACK_PARENT: ${{ inputs.ack_parent }}
      CHECKTRAIL_MANIFEST_SHA256: e5a8e59244f4af1292786111c54fc86ca81a3c55902079005eb3b8573f0590be
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read reviewed first-party diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify all first-party synthetic controls
        timeout-minutes: 7
        shell: bash
        run: python3 -I -S -B scripts/producer-sdk10/run_checks.py --out "$RUNNER_TEMP/sdk10-synthetic-controls" --manifest-sha256 "$CHECKTRAIL_MANIFEST_SHA256"
      - name: Original SDK10 producer and private stopped-evidence encryption
        id: producer
        continue-on-error: true
        shell: bash
        run: python3 -I -S -B scripts/producer-sdk10/driver.py produce --nonce "$CHECKTRAIL_NONCE" --manifest-sha256 "$CHECKTRAIL_MANIFEST_SHA256"
      - name: Prepare exact two-slot SDK10 window 01
        id: prepare_01
        if: always() && steps.producer.outputs.capture_ready == 'true' && fromJSON(steps.producer.outputs.total_carriers || '0') >= 2
        shell: bash
        run: python3 -I -S -B scripts/producer-sdk10/driver.py prepare-window --window 1 --nonce "$CHECKTRAIL_NONCE" --manifest-sha256 "$CHECKTRAIL_MANIFEST_SHA256"
      - name: Upload encrypted SDK10 carrier 000001
        id: upload_01_a
        if: always() && steps.prepare_01.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-native-${{ github.run_id }}-1-${{ inputs.nonce }}-000001
          path: ${{ runner.temp }}/ct-sdk10-${{ inputs.nonce }}/windows/01/000001/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: false
      - name: Upload encrypted SDK10 carrier 000002
        id: upload_01_b
        if: always() && steps.prepare_01.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ct-sdk10-native-${{ github.run_id }}-1-${{ inputs.nonce }}-000002
          path: ${{ runner.temp }}/ct-sdk10-${{ inputs.nonce }}/windows/01/000002/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: false
      - name: Record exact SDK10 two-slot window 01
        id: record_01
        if: always() && steps.upload_01_a.outcome == 'success' && steps.upload_01_b.outcome == 'success'
        shell: bash
        env:
          EXACT_ARTIFACT_IDS: ${{ steps.upload_01_a.outputs.artifact-id }},${{ steps.upload_01_b.outputs.artifact-id }}
        run: python3 -I -S -B scripts/producer-sdk10/driver.py record-window --window 1 --ids "$EXACT_ARTIFACT_IDS" --nonce "$CHECKTRAIL_NONCE" --manifest-sha256 "$CHECKTRAIL_MANIFEST_SHA256"
