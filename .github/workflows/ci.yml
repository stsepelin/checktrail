name: Lifecycle readiness diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  tasks-runtime:
    name: Focused lifecycle readiness (ci-macos-node26)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: ci-macos-node26
            lane: ci-macos-node26
            core: true
            consumer: true
            os: macos-26
            node: "26.9.0"
    env:
      CHECKTRAIL_LIFECYCLE_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Mark native consumer producer execution
        id: native-start
        if: matrix.consumer
        run: node scripts/consumer-native-job-claims.mjs start ${{ matrix.slot }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Diagnose native Windows private-access setup boundaries
        if: matrix.slot == 'windows-node22'
        run: node scripts/diagnose-windows-task-access.mjs
      - name: Prepare pinned production installation cache
        run: node scripts/prepare-package-cache.mjs
      - name: Require source and retained fresh-install controls with exact runtime and observed image identity
        if: matrix.core
        run: node scripts/verify-tasks-runtime.mjs ${{ matrix.slot }}
      - name: Require runtime selection and installation admission controls
        if: matrix.core
        run: node scripts/verify-required-native-tests.mjs review-runtime-bindings probe-workspace-privacy
      - name: Require whole candidate workflow source and offline installed runtime evidence
        if: matrix.core
        run: node scripts/verify-review-runtime.mjs ${{ matrix.slot }}
      - name: Require lifecycle runtime admission and source/fresh controls
        if: matrix.core
        run: |
          node scripts/verify-required-native-tests.mjs lifecycle-runtime-bindings &&
          node scripts/verify-lifecycle-platforms.mjs ${{ matrix.slot }}
