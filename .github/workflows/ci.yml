name: Verify

on:
  push:
    branches-ignore:
      - "pr/**"
      - "dependabot/**"
    tags:
      - "**"
  pull_request:

# Keep the latest candidate per PR or branch; preserve tag verification.
# This groups workflow runs, not the independent jobs within each run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: runner.os != 'macOS'
        with:
          php-version: "8.5"
          coverage: none
      - name: Prepare PHP from the pinned macOS build-cache action
        uses: shivammathur/setup-php@bc12f5cef4c73a871331e196ff380d38232ba293 # 2.40.0-beta
        if: runner.os == 'macOS'
        with:
          php-version: "8.5"
          coverage: none
      - name: Verify required toolchains
        run: |
          node --version
          go version
          python3 --version
          php --version
      - name: Prepare pinned Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown
          dirname "$(rustup which --toolchain 1.98.1 rustc)" >> "$GITHUB_PATH"
      - name: Prepare pinned Go analyzers
        run: |
          mkdir -p .checktrail/go-tools/bin
          GOBIN="$PWD/.checktrail/go-tools/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          .checktrail/go-tools/bin/staticcheck -version
          GOBIN="$PWD/.checktrail/go-tools/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          .checktrail/go-tools/bin/golangci-lint version --short
          echo "$PWD/.checktrail/go-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare locked PHP test tools
        run: |
          mkdir -p .checktrail/php-tools
          cp scripts/php-tools/composer.json scripts/php-tools/composer.lock .checktrail/php-tools/
          composer install --working-dir=.checktrail/php-tools --no-interaction --no-scripts --prefer-dist --no-progress
      - name: Prepare locked PHP review tools
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          composer install --working-dir=.checktrail/php-review-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Prepare locked Laravel runtime fixtures
        run: |
          mkdir -p .checktrail/laravel-tools
          cp scripts/laravel-tools/composer.json scripts/laravel-tools/composer.lock .checktrail/laravel-tools/
          composer install --working-dir=.checktrail/laravel-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - run: python3 -m pip install -r scripts/python-tools.requirements.txt
      - run: python3 -m pip install -r scripts/framework-tools.requirements.txt
      - run: npm ci --ignore-scripts
      - name: Prepare locked legacy TypeScript compiler
        run: |
          mkdir -p .checktrail/typescript-legacy-tools
          cp scripts/typescript-legacy-tools/package.json scripts/typescript-legacy-tools/package-lock.json .checktrail/typescript-legacy-tools/
          npm ci --prefix .checktrail/typescript-legacy-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Vue Router fixtures
        run: |
          mkdir -p .checktrail/vue-router-tools
          cp scripts/vue-router-tools/package.json scripts/vue-router-tools/package-lock.json .checktrail/vue-router-tools/
          npm ci --prefix .checktrail/vue-router-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Nuxt fixtures
        run: |
          mkdir -p .checktrail/nuxt-tools
          cp scripts/nuxt-tools/package.json scripts/nuxt-tools/package-lock.json .checktrail/nuxt-tools/
          npm ci --prefix .checktrail/nuxt-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned Chromium for native browser fixtures
        run: PLAYWRIGHT_BROWSERS_PATH=.checktrail/playwright-browsers node node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Audit finite inventory structure and preserved native obligations
        run: node scripts/audit-gate-inventory.mjs .
      - name: Require the full suite and prepared native regression profiles
        run: |
          node scripts/verify-required-native-tests.mjs --full-suite gate-inventory laravel-cache import-history init-publication posix-cleanup native-raw-evidence native-json-evidence windows-contract core native-acceptance-ledger native-process-observer mcp-tasks-routing mcp-tasks mcp-task-dispatch javascript python frameworks go php-tools php-review laravel rust rust-format clippy rust-tests rust-workspace review-budget review-workflow review-workflow-audit review-benchmark review-benchmark-judging review-benchmark-scoring review-benchmark-multi review-paired-scoring review-multi-scoring review-calibration import-context review-claim-probability review-native-budget review-workflow-multi selected-syntax-context go-extensions review-context-limits host-session-readiness context-python context-go context-php context-rust assembly-vue-router confidence-provenance
          CHECKTRAIL_TEST_TASKS=1 node --test dist/test/mcp.test.js
      - name: Verify concurrent init publication in a fresh installed CLI
        run: node scripts/verify-init-publication-package.mjs
      - run: node scripts/verify-posix-cleanup-guards.mjs
      - run: node scripts/verify-review-benchmark-multi-guards.mjs
      - run: node scripts/verify-review-workflow-multi-guards.mjs
      - run: node scripts/verify-selected-syntax-guards.mjs
      - run: node scripts/verify-host-session-guards.mjs
      - name: Verify confidence and evidence provenance guard controls
        run: node scripts/verify-confidence-provenance-guards.mjs
      - run: node scripts/verify-go-context-guards.mjs
      - run: node scripts/verify-python-context-guards.mjs
      - run: node scripts/verify-acceptance-ledger-guards.mjs
      - name: Verify native Laravel owned-cache guards and fresh package
        run: |
          node scripts/verify-laravel-cache-guards.mjs
          node scripts/verify-laravel-cache-package.mjs
      - name: Verify historical import guard controls
        run: node scripts/verify-import-history-guards.mjs
      - run: npm run format:check
      - run: node scripts/audit-dependencies.mjs
      - run: node scripts/audit-context-grammars.mjs
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/smoke-package.mjs
      - name: Verify POSIX cleanup in the production package
        run: node scripts/verify-posix-cleanup-package.mjs
      - name: Verify aggregate review budgets in the production package
        run: node scripts/verify-review-budget-package.mjs
      - name: Verify model-independent workflow in the production package
        run: node scripts/verify-review-workflow-package.mjs
      - name: Verify every candidate and its audit in the production package
        run: node scripts/verify-review-workflow-package.mjs --all-candidates
      - name: Verify durable workflow audits in the production package
        run: node scripts/verify-review-workflow-audit-package.mjs
      - name: Verify import context in the production package
        run: node scripts/verify-import-context-package.mjs
      - name: Verify selected captured syntax in the production package
        run: CHECKTRAIL_IMPORT_CONTEXT_PROFILE=selected-syntax-context node scripts/verify-import-context-package.mjs
      - name: Verify fresh historical import package
        run: CHECKTRAIL_IMPORT_CONTEXT_PROFILE=import-history node scripts/verify-import-context-package.mjs
      - name: Repeat physical native evidence controls in an offline installed package
        run: node scripts/verify-native-raw-package.mjs
      - name: Repeat structured native value controls in an offline installed package
        run: node scripts/verify-native-json-package.mjs
      - name: Verify sealed claim probabilities in the production package
        run: node scripts/verify-review-claim-probability-package.mjs
      - name: Verify calibration fitting and application in the production package
        run: node scripts/verify-review-calibration-package.mjs
      - name: Require original compiling multi-claim guard controls
        run: node scripts/verify-review-multi-guards.mjs
      - name: Verify multi-claim scoring in the production package
        run: node scripts/verify-review-multi-package.mjs
      - name: Verify paired scoring in the production package
        run: node scripts/verify-review-paired-package.mjs
      - name: Verify sealed benchmark scoring in the production package
        run: node scripts/verify-review-benchmark-score-package.mjs
      - name: Verify sealed multi-claim scoring in the production package
        run: node scripts/verify-review-benchmark-multi-package.mjs
      - name: Verify sealed synthetic benchmark intake in the production package
        run: node scripts/verify-review-benchmark-package.mjs
      - name: Verify installed MCP Tasks lifecycle offline on the host
        run: node scripts/verify-mcp-tasks-package.mjs
      - name: Verify installed PHP review profiles offline on the host
        run: node scripts/verify-php-review-package.mjs
      - name: Verify installed Rust formatting offline on the host
        run: node scripts/verify-rust-format-package.mjs
      - name: Verify installed Clippy analysis offline on the host
        run: node scripts/verify-clippy-package.mjs
      - name: Verify installed Rust test execution offline on the host
        run: node scripts/verify-rust-test-package.mjs
      - name: Verify installed Rust workspace profiles offline on the host
        run: node scripts/verify-rust-workspace-package.mjs
      - name: Verify repeated Go profiles in the production package
        run: node scripts/verify-go-matrix-package.mjs
      - name: Verify compiling expanded context guards
        run: node scripts/verify-context-limits-guards.mjs
      - name: Verify installed expanded context controls
        run: CHECKTRAIL_IMPORT_CONTEXT_PROFILE=review-context-limits node scripts/verify-import-context-package.mjs
      - name: Verify compiling Go workspace guards
        run: node scripts/verify-go-workspace-guards.mjs
      - name: Verify installed Go workspace controls
        run: node scripts/verify-go-workspace-package.mjs
      - name: Prepare pinned public images with bounded delivery retries
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          node scripts/pull-pinned-image.mjs public.ecr.aws/docker/library/golang@sha256:ae5a2316d12f3e78fd99177dad452e6ad4f240af2d71d57b480c3477f250fec6
          node scripts/pull-pinned-image.mjs public.ecr.aws/docker/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned review runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: docker build --file scripts/review-tools.Dockerfile --tag checktrail-review-tools:finish-first-v1 scripts
      - name: Verify review exchange in the packaged Linux runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/verify-review-container.mjs
      - name: Verify task storage and execution in the packaged Linux runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/verify-task-store-container.mjs
      - name: Verify installed MCP Tasks lifecycle offline in Linux
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: CHECKTRAIL_TASKS_IMAGE=public.ecr.aws/docker/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 node scripts/verify-mcp-tasks-package.mjs

  php-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
