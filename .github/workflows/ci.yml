name: Windows CI shell diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr150-windows-shell-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell-observation:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - id: original
        continue-on-error: true
        run: |
          cmd.exe /c 'echo first>original-first.marker & exit 7'
          cmd.exe /c 'echo second>original-second.marker & exit 0'
      - id: chained
        continue-on-error: true
        run: |
          cmd.exe /c 'echo first>chained-first.marker & exit 7' &&
          cmd.exe /c 'echo second>chained-second.marker & exit 0'
      - name: Retain original and chained native failure observations
        if: always()
        env:
          ORIGINAL_OUTCOME: ${{ steps.original.outcome }}
          CHAINED_OUTCOME: ${{ steps.chained.outcome }}
        run: |
          $observed = @{
            scope = 'Synthetic shell control; no project or Gate A acceptance'
            originalOutcome = $env:ORIGINAL_OUTCOME
            originalFirst = (Test-Path original-first.marker)
            originalSecond = (Test-Path original-second.marker)
            chainedOutcome = $env:CHAINED_OUTCOME
            chainedFirst = (Test-Path chained-first.marker)
            chainedSecond = (Test-Path chained-second.marker)
          }
          $observed | ConvertTo-Json -Compress
          if (!$observed.originalFirst -or !$observed.chainedFirst -or $observed.chainedSecond -or $observed.chainedOutcome -ne 'failure') {
            throw 'The chained control did not execute and retain its first native failure'
          }
