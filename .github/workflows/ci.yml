name: SDK10 optional capacity metadata
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: sdk10-optional-capacity-metadata
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Observe capacity without source execution
        shell: bash
        run: |
          python3 -I -B - <<'PY_CAPACITY'
          #!/usr/bin/env python3
          """Metadata only. This program never admits or executes the SDK producer."""
          import hashlib,json,os,pathlib,platform,shutil,subprocess,time
          GiB=1024**3
          started=time.monotonic()
          def command(argv):
           try:
            r=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20,check=False)
            if len(r.stdout)+len(r.stderr)>1048576:return {'state':'unavailable','reason':'metadata output budget'}
            return {'state':'complete','exitCode':r.returncode,'stdout':r.stdout.decode('utf-8','strict'),'stderrBytes':len(r.stderr),'stderrSHA256':hashlib.sha256(r.stderr).hexdigest()}
           except (OSError,subprocess.TimeoutExpired,UnicodeError) as e:return {'state':'unavailable','reason':type(e).__name__}
          mem={}
          try:
           for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
            k,_,v=line.partition(':')
            if k in ['MemTotal','MemAvailable']:mem[k]=int(v.split()[0])*1024
          except (OSError,ValueError):pass
          try:cpus=len(os.sched_getaffinity(0))
          except AttributeError:cpus=os.cpu_count()
          disks=[]
          for name,p in [('runnerTemporary',os.environ.get('RUNNER_TEMP')),('workspace',os.environ.get('GITHUB_WORKSPACE'))]:
           if not p:disks.append({'role':name,'state':'unavailable'});continue
           try:
            x=shutil.disk_usage(p);disks.append({'role':name,'state':'complete','totalBytes':x.total,'freeBytes':x.free,'device':os.stat(p).st_dev})
           except OSError as e:disks.append({'role':name,'state':'unavailable','reason':type(e).__name__})
          format0='{"architecture":{{json .Architecture}},"cpus":{{json .NCPU}},"memoryBytes":{{json .MemTotal}},"root":{{json .DockerRootDir}},"driver":{{json .Driver}}}'
          docker=command(['docker','info','--format',format0]);parsed=None
          if docker.get('exitCode')==0:
           try:parsed=json.loads(docker.pop('stdout'))
           except (ValueError,KeyError):docker={'state':'unavailable','reason':'Docker metadata schema'}
          else:docker.pop('stdout',None)
          ps=command(['docker','ps','-q','--no-trunc']);active=None
          if ps.get('exitCode')==0:active=len(ps.pop('stdout').splitlines())
          else:ps.pop('stdout',None)
          if parsed:
           try:
            x=shutil.disk_usage(parsed['root']);disks.append({'role':'dockerData','state':'complete','totalBytes':x.total,'freeBytes':x.free,'device':os.stat(parsed['root']).st_dev})
           except (OSError,KeyError) as e:disks.append({'role':'dockerData','state':'unavailable','reason':type(e).__name__})
          hardware={'hostLinuxAMD64':platform.system()=='Linux' and platform.machine() in ['x86_64','amd64'],'atLeast4AvailableCPUs':isinstance(cpus,int) and cpus>=4,'hostAtLeast15GiBRAM':mem.get('MemTotal',0)>=15*GiB,'dockerReportsAMD64':bool(parsed and parsed.get('architecture') in ['x86_64','amd64']),'dockerAtLeast15GiBRAM':bool(parsed and parsed.get('memoryBytes',0)>=15*GiB),'noPreexistingRunningContainers':active==0,'noDockerEndpointEnvironmentOverrides':not any(os.environ.get(k) for k in ['DOCKER_HOST','DOCKER_CONTEXT','DOCKER_TLS_VERIFY'])}
          result={'schemaVersion':1,'scope':'SDK10 optional hosted capacity metadata only','elapsedSeconds':time.monotonic()-started,'observedHost':{'system':platform.system(),'architecture':platform.machine(),'availableCPUs':cpus,'memoryBytes':mem},'docker':docker,'selectedDockerMetadata':parsed,'runningContainerMetadata':ps,'runningContainerCount':active,'diskMetadata':disks,'provisionalHardwareChecks':hardware,'allProvisionalHardwareChecksObserved':all(hardware.values()),'provisional60GiBScratchTargetMet':all(x.get('state')=='complete' and x.get('freeBytes',0)>=60*GiB for x in disks) and len(disks)==3,'actualInputLayerAndTransportSizesStillNeedReconciliation':True,'artifactCapacityAndFullPrivateRecoveryAdmitted':False,'nativeProducerAdmissionGranted':False,'sourceOrSDKDownloadedExtractedOrExecuted':False,'ordinaryRequiredCIChanged':False}
          print('SDK10_CAPACITY_METADATA='+json.dumps(result,sort_keys=True,separators=(',',':')))
          PY_CAPACITY
