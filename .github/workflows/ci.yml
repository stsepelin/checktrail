# Diagnostic dispatch only. Never merge this workflow into the product branch.
name: Upgrade observer Windows diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-resource:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Prepare pinned production installation cache
        run: node scripts/prepare-package-cache.mjs
      - name: Prepare pinned older public package without lifecycle scripts
        run: node scripts/prepare-release-readiness-tools.mjs
      - name: Retain observer regression and failure controls
        shell: bash
        run: node --test dist/test/upgrade-observation.test.js > upgrade-observer-tests.txt 2>&1
      - name: Require original source and fresh offline resource readiness
        shell: bash
        run: node scripts/verify-resource-release-readiness.mjs windows-node22 > resource-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upgrade-observer-windows-node22
          path: |
            upgrade-observer-tests.txt
            resource-receipt.json
          retention-days: 30
          if-no-files-found: error
