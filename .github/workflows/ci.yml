name: Focused Windows resource command diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-resource-diagnostic:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Record native Windows profile identity
        shell: pwsh
        run: |
          $env:CHECKTRAIL_WINDOWS_RESOURCE_DIAGNOSTIC_DIRECTORY = Join-Path $env:RUNNER_TEMP 'checktrail-resource-diagnostics'
          "CHECKTRAIL_WINDOWS_RESOURCE_DIAGNOSTIC_DIRECTORY=$env:CHECKTRAIL_WINDOWS_RESOURCE_DIAGNOSTIC_DIRECTORY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:CHECKTRAIL_WINDOWS_RESOURCE_DIAGNOSTIC_DIRECTORY | Out-Null
          [ordered]@{ originalSourceCommit = '63aae0d10ea46e06bb10eeaf53f005279ff80845'; diagnosticSourceCommit = $env:GITHUB_SHA; node = (node --version); imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; os = [Environment]::OSVersion.VersionString; originalAcceptance = $false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:CHECKTRAIL_WINDOWS_RESOURCE_DIAGNOSTIC_DIRECTORY 'identity.json')
          node --version
          [Environment]::OSVersion.VersionString
          $env:ImageVersion
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable | ConvertTo-Json -Depth 3'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Diagnose original native Windows startup
        run: node scripts/probe-windows-runner.mjs
      - name: Require native Windows argument environment process tree and shared engine controls
        run: node scripts/verify-required-native-tests.mjs windows-process
      - name: Require physical process output controls on native Windows
        run: node scripts/verify-required-native-tests.mjs physical-process-output
      - name: Require actual native namespace cleanup races and exhausted refusal
        run: node scripts/verify-required-native-tests.mjs native-harness-cleanup
      - name: Require native compiling mutation guards with unchanged callbacks
        run: node scripts/verify-windows-guards.mjs
      - name: Require native Windows workload and accounting controls
        run: node scripts/verify-required-native-tests.mjs windows-resource-workload-bindings windows-resource-workloads
      - name: Retain bounded command-failure context and actual runner identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focused-windows-resource-diagnostic
          path: ${{ runner.temp }}/checktrail-resource-diagnostics/*.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
