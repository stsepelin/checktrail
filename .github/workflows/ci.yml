name: Verify

on:
  push:
    branches-ignore:
      - "pr/**"
      - "dependabot/**"
      - "fix/**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

# Keep the latest candidate per PR or branch; preserve tag verification.
# This groups workflow runs, not the independent jobs within each run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - id: impact
        run: node scripts/plan-ci-impact.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        if: runner.os != 'macOS'
        with:
          php-version: "8.5"
          coverage: none
      - name: Prepare PHP from the pinned macOS build-cache action
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        if: runner.os == 'macOS'
        with:
          php-version: "8.5"
          coverage: none
      - name: Verify required toolchains
        run: |
          node --version
          go version
          python3 --version
          php --version
      - name: Prepare pinned Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown
          dirname "$(rustup which --toolchain 1.98.1 rustc)" >> "$GITHUB_PATH"
      - name: Prepare pinned Go analyzers
        run: |
          node scripts/prepare-go-tools.mjs
          echo "$PWD/.checktrail/go-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare locked PHP test tools
        run: |
          mkdir -p .checktrail/php-tools
          cp scripts/php-tools/composer.json scripts/php-tools/composer.lock .checktrail/php-tools/
          composer install --working-dir=.checktrail/php-tools --no-interaction --no-scripts --prefer-dist --no-progress
      - name: Prepare locked PHP review tools
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          composer install --working-dir=.checktrail/php-review-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Prepare locked Laravel runtime fixtures
        run: |
          mkdir -p .checktrail/laravel-tools
          cp scripts/laravel-tools/composer.json scripts/laravel-tools/composer.lock .checktrail/laravel-tools/
          composer install --working-dir=.checktrail/laravel-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - run: python3 -m pip install -r scripts/python-tools.requirements.txt
      - run: python3 -m pip install -r scripts/framework-tools.requirements.txt
      - run: npm ci --ignore-scripts
      - name: Prepare locked legacy TypeScript compiler
        run: |
          mkdir -p .checktrail/typescript-legacy-tools
          cp scripts/typescript-legacy-tools/package.json scripts/typescript-legacy-tools/package-lock.json .checktrail/typescript-legacy-tools/
          npm ci --prefix .checktrail/typescript-legacy-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Vue Router fixtures
        run: |
          mkdir -p .checktrail/vue-router-tools
          cp scripts/vue-router-tools/package.json scripts/vue-router-tools/package-lock.json .checktrail/vue-router-tools/
          npm ci --prefix .checktrail/vue-router-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Nuxt fixtures
        run: |
          mkdir -p .checktrail/nuxt-tools
          cp scripts/nuxt-tools/package.json scripts/nuxt-tools/package-lock.json .checktrail/nuxt-tools/
          npm ci --prefix .checktrail/nuxt-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned Chromium for native browser fixtures
        run: PLAYWRIGHT_BROWSERS_PATH=.checktrail/playwright-browsers node node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify captured consumer selection guards
        if: runner.os == 'Linux' && matrix.node == '26'
        run: node scripts/verify-consumer-impact-guards.mjs
      - name: Audit finite inventory structure and preserved native obligations
        run: node scripts/audit-gate-inventory.mjs .
      - name: Require the full suite and prepared native regression profiles
        run: |
          node scripts/verify-required-native-tests.mjs --full-suite gate-inventory evaluation-protocol-declarations evaluation-protocol-metering evaluation-capture-declarations evaluation-physical-captures evaluation-independent-judging evaluation-common-matching independent-evaluation-protocol laravel-cache import-history init-publication posix-cleanup native-raw-evidence native-json-evidence windows-contract core native-acceptance-ledger native-process-observer mcp-tasks-routing mcp-tasks tasks-matrix mcp-task-dispatch javascript python frameworks go php-tools php-review laravel rust rust-format clippy rust-tests rust-workspace review-budget review-workflow review-workflow-audit review-benchmark review-benchmark-judging review-benchmark-scoring review-benchmark-multi review-paired-scoring review-multi-scoring review-calibration import-context review-claim-probability review-native-budget review-workflow-multi selected-syntax-context go-extensions review-context-limits host-session-readiness context-python context-go context-php context-rust assembly-vue-router confidence-provenance
          node scripts/verify-required-native-tests.mjs tasks-runtime-manifest tasks-runtime-cli
          CHECKTRAIL_TEST_TASKS=1 node --test dist/test/mcp.test.js
      - name: Verify fresh installed external usage accounting
        run: node scripts/verify-evaluation-protocol-package.mjs --metering
      - run: npm run format:check
      - run: node scripts/audit-dependencies.mjs
      - run: node scripts/audit-context-grammars.mjs
      - name: Prepare this runner's package-install cache for Linux container acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/prepare-package-cache.mjs
      - name: Prepare pinned public images with bounded delivery retries
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: |
          node scripts/pull-pinned-image.mjs docker.io/library/golang@sha256:ae5a2316d12f3e78fd99177dad452e6ad4f240af2d71d57b480c3477f250fec6
          node scripts/pull-pinned-image.mjs docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned review runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: docker build --file scripts/review-tools.Dockerfile --tag checktrail-review-tools:finish-first-v1 scripts
      - name: Verify review exchange in the packaged Linux runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/verify-review-container.mjs
      - name: Verify task storage and execution in the packaged Linux runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/verify-task-store-container.mjs
      - name: Verify installed MCP Tasks lifecycle offline in Linux
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: CHECKTRAIL_TASKS_IMAGE=docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 node scripts/verify-mcp-tasks-package.mjs

  host-validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        if: runner.os != 'macOS'
        with:
          php-version: "8.5"
          coverage: none
      - name: Prepare PHP from the pinned macOS build-cache action
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        if: runner.os == 'macOS'
        with:
          php-version: "8.5"
          coverage: none
      - name: Verify required toolchains
        run: |
          node --version
          go version
          python3 --version
          php --version
      - name: Prepare pinned Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown
          dirname "$(rustup which --toolchain 1.98.1 rustc)" >> "$GITHUB_PATH"
      - name: Prepare pinned Go analyzers
        run: |
          node scripts/prepare-go-tools.mjs
          echo "$PWD/.checktrail/go-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare locked PHP test tools
        run: |
          mkdir -p .checktrail/php-tools
          cp scripts/php-tools/composer.json scripts/php-tools/composer.lock .checktrail/php-tools/
          composer install --working-dir=.checktrail/php-tools --no-interaction --no-scripts --prefer-dist --no-progress
      - name: Prepare locked PHP review tools
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          composer install --working-dir=.checktrail/php-review-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Prepare locked Laravel runtime fixtures
        run: |
          mkdir -p .checktrail/laravel-tools
          cp scripts/laravel-tools/composer.json scripts/laravel-tools/composer.lock .checktrail/laravel-tools/
          composer install --working-dir=.checktrail/laravel-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - run: python3 -m pip install -r scripts/python-tools.requirements.txt
      - run: python3 -m pip install -r scripts/framework-tools.requirements.txt
      - run: npm ci --ignore-scripts
      - name: Prepare locked legacy TypeScript compiler
        run: |
          mkdir -p .checktrail/typescript-legacy-tools
          cp scripts/typescript-legacy-tools/package.json scripts/typescript-legacy-tools/package-lock.json .checktrail/typescript-legacy-tools/
          npm ci --prefix .checktrail/typescript-legacy-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Vue Router fixtures
        run: |
          mkdir -p .checktrail/vue-router-tools
          cp scripts/vue-router-tools/package.json scripts/vue-router-tools/package-lock.json .checktrail/vue-router-tools/
          npm ci --prefix .checktrail/vue-router-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Nuxt fixtures
        run: |
          mkdir -p .checktrail/nuxt-tools
          cp scripts/nuxt-tools/package.json scripts/nuxt-tools/package-lock.json .checktrail/nuxt-tools/
          npm ci --prefix .checktrail/nuxt-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned Chromium for native browser fixtures
        run: PLAYWRIGHT_BROWSERS_PATH=.checktrail/playwright-browsers node node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - run: npm run build
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - name: Require isolated mutation and fresh package lanes
        run: node scripts/run-ci-validation.mjs
      - name: Verify captured consumer impact in the offline production package
        run: node scripts/verify-consumer-impact-package.mjs

  php-review:
    needs: [ci-plan, actionlint]
    if: ${{ always() && !cancelled() && (needs.ci-plan.result != 'success' || fromJSON(needs.ci-plan.outputs.plan).selected['php-review']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned public images with bounded delivery retries
        run: |
          node scripts/pull-pinned-image.mjs docker.io/library/composer@sha256:b09bccd91a78fe8a9ab4b33d707b862e8fe54fec17782e32683ad2a69c46867d
          node scripts/pull-pinned-image.mjs docker.io/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned PHP runtime
        run: docker build --file scripts/php-review-tools.Dockerfile --tag checktrail-php-review:synthetic-v1 scripts
      - name: Prepare locked native tools without project lifecycles
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          docker run --rm --mount "type=bind,src=$PWD/.checktrail/php-review-tools,target=/tools" --workdir /tools checktrail-php-review:synthetic-v1 composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Require native PHP evidence offline
        run: docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-php-review:synthetic-v1 node scripts/verify-required-native-tests.mjs php-review
      - name: Audit installed PHP review metadata and notices
        run: node scripts/audit-php-review-tools.mjs
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - name: Require installed PHP review evidence offline
        run: CHECKTRAIL_PHP_REVIEW_IMAGE=checktrail-php-review:synthetic-v1 node scripts/verify-php-review-package.mjs

  clang:
    needs: [ci-plan, actionlint]
    if: ${{ always() && !cancelled() && (needs.ci-plan.result != 'success' || fromJSON(needs.ci-plan.outputs.plan).selected['clang']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
