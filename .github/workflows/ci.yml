        run: CHECKTRAIL_IMPORT_CONTEXT_PROFILE=review-context-limits node scripts/verify-import-context-package.mjs
      - name: Verify installed original synthetic host controls
        run: CHECKTRAIL_IMPORT_CONTEXT_PROFILE=host-session-readiness node scripts/verify-import-context-package.mjs
      - name: Verify installed original Python context controls
