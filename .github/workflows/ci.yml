      - name: Prepare existing locked public PHP toolchains
        run: |
          for profile in php-tools php-review-tools; do
            mkdir -p ".checktrail/$profile"
            cp "scripts/$profile/composer.json" "scripts/$profile/composer.lock" ".checktrail/$profile/"
            if [ "$profile" = php-tools ]; then
              # The locked, explicitly allowed Pest plugin writes pest-plugins.json.
              docker run --rm --mount "type=bind,src=$PWD/.checktrail/$profile,target=/tools" --workdir /tools "$CHECKTRAIL_PHP_EXTENSIONS_IMAGE" composer install --no-interaction --no-scripts --prefer-dist --no-progress
