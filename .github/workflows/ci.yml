# Candidate-only original native acceptance; no protected ci-complete context or whole Gate A claim.
name: Native candidate acceptance
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
concurrency:
  group: native-candidate-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate-windows-native:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 84de1eca77324ad45f1bdae9cefb8d863123dcfe
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
          cache: npm
      - name: Record native Windows profile identity
        shell: pwsh
        run: |
          node --version
          [Environment]::OSVersion.VersionString
          $env:ImageVersion
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable | ConvertTo-Json -Depth 3'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Diagnose original native Windows startup
        run: node scripts/probe-windows-runner.mjs
      - name: Require native Windows argument environment process tree and shared engine controls
        run: node scripts/verify-required-native-tests.mjs windows-process
      - name: Require physical process output controls on native Windows
        run: node scripts/verify-required-native-tests.mjs physical-process-output
      - name: Require actual native namespace cleanup races and exhausted refusal
        run: node scripts/verify-required-native-tests.mjs native-harness-cleanup
      - name: Require native compiling mutation guards with unchanged callbacks
        run: node scripts/verify-windows-guards.mjs
      - name: Require native Windows workload and accounting controls
        run: node scripts/verify-required-native-tests.mjs windows-resource-workload-bindings windows-resource-workloads
      - name: Require native resource counter and fixed-source integrity guards
        run: node scripts/verify-windows-resource-guards.mjs
      - name: Require native workspace privacy before bootstrap data
        run: node scripts/verify-windows-workspace-guard.mjs
      - run: npm run format:check
      - name: Prepare package install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - name: Repeat original controls in an offline locked production installation
        run: node scripts/verify-windows-package.mjs
    name: Candidate Windows original native controls
  candidate-windows-provenance:
    name: Candidate Windows original provenance source and fresh controls
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 84de1eca77324ad45f1bdae9cefb8d863123dcfe
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/prepare-package-cache.mjs
      - name: Require provenance composition from source and a fresh offline package
        id: native-provenance-runtime
        timeout-minutes: 10
        run: node scripts/verify-native-provenance-runtime.mjs windows-node22
        env:
          CHECKTRAIL_NATIVE_PROVENANCE_RUNTIME_RECEIPT: ${{ runner.temp }}/native-provenance-runtime.json
      - name: Retain original bounded provenance runtime receipt bytes
        if: ${{ !cancelled() && steps.native-provenance-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-native-provenance-windows-node22-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-provenance-runtime.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
