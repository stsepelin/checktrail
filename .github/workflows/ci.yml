name: Native provenance diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-provenance-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-original-stale-diagnostic:
    name: Windows original stale callback diagnostic
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact failing application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stsepelin/checktrail
          ref: de1753a0c662b73fa66df145c05d0539ac839379
          persist-credentials: false
      - name: Set up the original selected Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      - name: Install the pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the original source normally
        id: build
        run: npm run build
      - name: Prepare the bounded first-party diagnostic controller
        id: controller
        run: |
          $program = @'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFile, realpath, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { run } from "node:test";
          import process from "node:process";
          import console from "node:console";
          import { performance } from "node:perf_hooks";
          import { fileURLToPath, pathToFileURL } from "node:url";

          const SOURCE = "de1753a0c662b73fa66df145c05d0539ac839379";
          const CASE = "native-license-provenance stale acceptance";
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const errorNames = new Set([
            "Error",
            "AssertionError",
            "TypeError",
            "RangeError",
            "AbortError",
            "SyntaxError",
          ]);
          const errorCodes = new Set([
            "ERR_ASSERTION",
            "ERR_TEST_FAILURE",
            "ERR_TEST_TIMEOUT",
            "ERR_INVALID_ARG_TYPE",
            "ABORT_ERR",
            "ETIMEDOUT",
            "ENOENT",
            "EACCES",
          ]);
          const failureTypes = new Set([
            "testCodeFailure",
            "testTimeoutFailure",
            "cancelledByParent",
            "subtestsFailed",
            "hookFailed",
            "testAborted",
          ]);
          const own = (value, key) => {
            if (!value || typeof value !== "object") return undefined;
            const descriptor = Object.getOwnPropertyDescriptor(value, key);
            return descriptor && "value" in descriptor ? descriptor.value : undefined;
          };
          const boundedDuration = (value) =>
            Number.isFinite(value) && value >= 0 && value <= 180000
              ? Math.round(value)
              : null;
          function frames(stack, sources) {
            if (typeof stack !== "string" || stack.length > 65536) return [];
            const lines = stack.split("\n");
            if (lines.length > 256) return [];
            const result = [];
            const seen = new Set();
            for (const line of lines.slice(1)) {
              const call = line.match(/^ {4}at (.+)$/u);
              if (!call) continue;
              const location = call[1].endsWith(")")
                ? call[1].match(/^[^()\r\n]+ \((.+)\)$/u)?.[1]
                : call[1];
              const match = location?.match(/^(.*):([1-9][0-9]*):([1-9][0-9]*)$/u);
              if (!match) continue;
              const source = sources.find(
                (item) => item.file === match[1] || item.url === match[1],
              );
              if (!source) continue;
              const row = Number(match[2]),
                column = Number(match[3]);
              if (
                !Number.isSafeInteger(row) ||
                !Number.isSafeInteger(column) ||
                row > source.lineLengths.length ||
                column > source.lineLengths[row - 1] + 1
              )
                continue;
              const key = `${source.id}:${row}:${column}`;
              if (seen.has(key)) continue;
              seen.add(key);
              if (result.length === 16) break;
              result.push({ sourceId: source.id, line: row, column });
            }
            return result;
          }
          function failure(error, sources) {
            const chain = [];
            const seen = new Set();
            for (
              let value = error;
              value && typeof value === "object" && chain.length < 8 && !seen.has(value);
              value = own(value, "cause")
            ) {
              seen.add(value);
              chain.push({
                code: errorCodes.has(own(value, "code")) ? own(value, "code") : "other",
                type: failureTypes.has(own(value, "failureType"))
                  ? own(value, "failureType")
                  : "other",
                name: errorNames.has(own(value, "name")) ? own(value, "name") : "other",
                frames: frames(own(value, "stack"), sources),
              });
            }
            return chain;
          }
          async function sourceContext() {
            const root = await realpath(process.cwd());
            assert.equal(
              execFileSync("git", ["rev-parse", "HEAD"], {
                cwd: root,
                encoding: "utf8",
                maxBuffer: 256,
                  timeout: 5000,
              }).trim(),
              SOURCE,
            );
            assert.equal(
              execFileSync("git", ["status", "--porcelain=v1", "--untracked-files=no"], {
                cwd: root,
                encoding: "utf8",
                maxBuffer: 65536,
                  timeout: 5000,
              }).trim(),
              "",
            );
            const specs = [
              [
                "gate-ts",
                "test/gate-native-license-provenance.test.ts",
                "41832012858f5e06e81a53da9a0407e85123d7acc9459864722a2c017f7fc9e8",
              ],
              [
                "fixture-ts",
                "test/native-license-provenance-fixture.ts",
                "5854fd6c2707e837bbdddac5322974fbf73b05f9b2a240f6a252466e6e42e853",
              ],
              ["gate-js", "dist/test/gate-native-license-provenance.test.js", null],
              ["fixture-js", "dist/test/native-license-provenance-fixture.js", null],
            ];
            const sources = [];
            for (const [id, local, pin] of specs) {
              const file = path.join(root, local);
              assert.equal(await realpath(file), file);
              const body = await readFile(file);
              assert.ok(body.length > 0 && body.length <= 4 * 1048576);
              const sha256 = hash(body);
              if (pin) assert.equal(sha256, pin);
              sources.push({
                id,
                file,
                url: pathToFileURL(file).href,
                bytes: body.length,
                sha256,
                lineLengths: body
                  .toString("utf8")
                  .split(/\r?\n/u)
                  .map((line) => line.length),
              });
            }
            const runtime = {
              node: process.versions.node,
              platform: process.platform,
              architecture: process.arch,
              nodeSha256: hash(await readFile(process.execPath)),
            };
            return { root, sources, runtime };
          }
          const publicSources = (sources) =>
            sources.map(({ id, bytes, sha256, lineLengths }) => ({
              id,
              bytes,
              sha256,
              lineCount: lineLengths.length,
            }));
          async function unchanged(before) {
            const after = await sourceContext();
            assert.deepEqual(publicSources(after.sources), publicSources(before.sources));
            assert.deepEqual(after.runtime, before.runtime);
          }
          async function callback() {
            assert.equal(process.platform, "win32");
            assert.equal(process.env.CHECKTRAIL_NATIVE_LICENSE_COMPOSITION_NATIVE, "1");
            const context = await sourceContext();
            const selected = context.sources.find((item) => item.id === "gate-js");
            const events = [];
            let selectedTerminals = 0,
              excludedTerminals = 0;
            // Original file-process isolation, concurrency and execArgv; only the name
            // selection and diagnostic file ceiling differ from the nine-case acceptance.
            for await (const { type, data } of run({
              files: [selected.file],
              concurrency: 1,
              timeout: 110000,
              execArgv: [],
              testNamePatterns: [/^native-license-provenance stale acceptance$/u],
            })) {
              if (data.name !== CASE) {
                if (type === "test:pass" || type === "test:fail") excludedTerminals++;
                continue;
              }
              if (type === "test:dequeue") {
                if (events.some((event) => event.event === "dequeued"))
                  throw new Error("Duplicate dequeue");
                events.push({ event: "dequeued" });
              }
              if (type !== "test:pass" && type !== "test:fail") continue;
              selectedTerminals++;
              assert.ok(selectedTerminals <= 1 && events.length < 3);
              const outcome =
                data.skip !== undefined && data.skip !== false
                  ? "skipped"
                  : data.todo !== undefined && data.todo !== false
                    ? "todo"
                    : type === "test:pass"
                      ? "passed"
                      : "failed";
              events.push({
                event: "terminal",
                outcome,
                durationMs: boundedDuration(data.details?.duration_ms),
                failure:
                  type === "test:fail"
                    ? failure(data.details?.error, context.sources)
                    : [],
              });
            }
            await unchanged(context);
            const result = {
              schemaVersion: 1,
              scope: "original-stale-callback-diagnostic-only",
              sourceCommit: SOURCE,
              runtime: context.runtime,
              sources: publicSources(context.sources),
              selectedCase: "stale",
              originalCaseTimeoutMs: 90000,
              diagnosticFileTimeoutMs: 110000,
              selectedTerminals,
              excludedTerminals,
              excludedOriginalCasesUncredited: 8,
              events,
              source9Qualified: false,
              fresh9Qualified: false,
              gateAQualified: false,
            };
            process.stdout.write(JSON.stringify(result) + "\n");
            process.exitCode =
              selectedTerminals === 1 &&
              events.some((event) => event.outcome === "passed")
                ? 0
                : 1;
          }
          function validateCallback(value, context) {
            const exact = (object, keys) => {
              assert.ok(object && typeof object === "object" && !Array.isArray(object));
              assert.deepEqual(Object.keys(object).sort(), [...keys].sort());
            };
            try {
              exact(value, [
                "schemaVersion",
                "scope",
                "sourceCommit",
                "runtime",
                "sources",
                "selectedCase",
                "originalCaseTimeoutMs",
                "diagnosticFileTimeoutMs",
                "selectedTerminals",
                "excludedTerminals",
                "excludedOriginalCasesUncredited",
                "events",
                "source9Qualified",
                "fresh9Qualified",
                "gateAQualified",
              ]);
              assert.equal(value.schemaVersion, 1);
              assert.equal(value.scope, "original-stale-callback-diagnostic-only");
              assert.equal(value.sourceCommit, SOURCE);
              assert.deepEqual(value.runtime, context.runtime);
              assert.deepEqual(value.sources, publicSources(context.sources));
              assert.equal(value.selectedCase, "stale");
              assert.equal(value.originalCaseTimeoutMs, 90000);
              assert.equal(value.diagnosticFileTimeoutMs, 110000);
              assert.ok(
                Number.isInteger(value.selectedTerminals) &&
                  value.selectedTerminals >= 0 &&
                  value.selectedTerminals <= 1,
              );
              assert.ok(
                Number.isInteger(value.excludedTerminals) &&
                  value.excludedTerminals >= 0 &&
                  value.excludedTerminals <= 10,
              );
              assert.equal(value.excludedOriginalCasesUncredited, 8);
              assert.equal(value.source9Qualified, false);
              assert.equal(value.fresh9Qualified, false);
              assert.equal(value.gateAQualified, false);
              assert.ok(Array.isArray(value.events) && value.events.length <= 2);
              let dequeues = 0,
                terminals = 0;
              for (const event of value.events) {
                if (event.event === "dequeued") {
                  exact(event, ["event"]);
                  assert.equal(++dequeues, 1);
                  assert.equal(terminals, 0);
                  continue;
                }
                exact(event, ["event", "outcome", "durationMs", "failure"]);
                assert.equal(event.event, "terminal");
                assert.equal(++terminals, 1);
                assert.ok(
                  ["passed", "failed", "skipped", "todo"].includes(event.outcome),
                );
                assert.ok(
                  event.durationMs === null ||
                    boundedDuration(event.durationMs) === event.durationMs,
                );
                assert.ok(Array.isArray(event.failure) && event.failure.length <= 8);
                for (const item of event.failure) {
                  exact(item, ["code", "type", "name", "frames"]);
                  assert.ok(item.code === "other" || errorCodes.has(item.code));
                  assert.ok(item.type === "other" || failureTypes.has(item.type));
                  assert.ok(item.name === "other" || errorNames.has(item.name));
                  assert.ok(Array.isArray(item.frames) && item.frames.length <= 16);
                  for (const frame of item.frames) {
                    exact(frame, ["sourceId", "line", "column"]);
                    const source = context.sources.find(
                      (row) => row.id === frame.sourceId,
                    );
                    assert.ok(
                      source &&
                        Number.isInteger(frame.line) &&
                        frame.line >= 1 &&
                        frame.line <= source.lineLengths.length,
                    );
                    assert.ok(
                      Number.isInteger(frame.column) &&
                        frame.column >= 1 &&
                        frame.column <= source.lineLengths[frame.line - 1] + 1,
                    );
                  }
                }
              }
              assert.equal(terminals, value.selectedTerminals);
              return true;
            } catch {
              return false;
            }
          }
          async function execute(mode) {
            assert.equal(process.platform, "win32");
            const context = await sourceContext();
            const { runProcess } = await import(
              pathToFileURL(path.join(context.root, "dist/src/runner.js")).href
            );
            const started = performance.now();
            const rows = [];
            if (mode === "probe") {
              const end = started + 75000;
              for (let index = 0; index < 5; index++) {
                const remaining = Math.floor(end - performance.now());
                if (remaining <= 0) break;
                const result = await runProcess(
                  context.root,
                  { executable: process.execPath, args: ["--version"], cwd: "." },
                  { timeoutMs: Math.min(15000, remaining), maxOutputBytes: 4096 },
                );
                const complete =
                  result.exitCode === 0 &&
                  !result.timedOut &&
                  !result.cancelled &&
                  !result.truncated &&
                  !result.errorCode &&
                  result.stdout.trim() === process.version &&
                  result.stderr === "" &&
                  result.windowsExecution?.cleanup === "confirmed";
                rows.push({
                  index,
                  durationMs: boundedDuration(result.durationMs),
                  status: result.exitCode,
                  timedOut: result.timedOut,
                  cancelled: result.cancelled,
                  complete,
                  outputBytes: result.outputBytes,
                });
                if (!complete) break;
              }
            } else {
              assert.equal(mode, "stale");
              const result = await runProcess(
                context.root,
                {
                  executable: process.execPath,
                  args: [fileURLToPath(import.meta.url), "callback"],
                  cwd: ".",
                  env: { CHECKTRAIL_NATIVE_LICENSE_COMPOSITION_NATIVE: "1" },
                },
                { timeoutMs: 120000, maxOutputBytes: 65536 },
              );
              // Only this fixed first-party callback runner can write the bounded payload.
              // Its stdout/stderr are never retained or echoed as diagnostic fields.
              let parsed = null;
              try {
                const value = JSON.parse(result.stdout);
                if (validateCallback(value, context)) parsed = value;
              } catch {
                /* Preserve unavailable evidence as null. */
              }
              rows.push({
                durationMs: boundedDuration(result.durationMs),
                status: result.exitCode,
                timedOut: result.timedOut,
                cancelled: result.cancelled,
                outputBytes: result.outputBytes,
                cleanupConfirmed: result.windowsExecution?.cleanup === "confirmed",
                callback: parsed,
              });
            }
            await unchanged(context);
            const output = {
              schemaVersion: 1,
              scope:
                mode === "probe"
                  ? "five-fixed-supervised-node-version-launches-only"
                  : "original-stale-callback-diagnostic-controller-only",
              sourceCommit: SOURCE,
              diagnosticWorkflowCommit: /^[a-f0-9]{40}$/u.test(
                process.env.GITHUB_SHA ?? "",
              )
                ? process.env.GITHUB_SHA
                : null,
              runtime: context.runtime,
              sourceFiles: publicSources(context.sources),
              controllerSha256: hash(await readFile(fileURLToPath(import.meta.url))),
              durationMs: Math.round(performance.now() - started),
              rows,
              source9Qualified: false,
              fresh9Qualified: false,
              gateAQualified: false,
              excludedOriginalCasesUncredited: mode === "probe" ? 9 : 8,
              rawBodiesEmitted: false,
            };
            await writeFile(
              path.join(
                process.env.RUNNER_TEMP,
                `native-provenance-${mode}-diagnostic.json`,
              ),
              JSON.stringify(output) + "\n",
              { flag: "wx", mode: 0o600 },
            );
            console.log(JSON.stringify(output));
            if (
              mode === "stale" &&
              (!rows[0].callback || rows[0].status !== 0 || !rows[0].cleanupConfirmed)
            )
              process.exitCode = 1;
            if (
              mode === "probe" &&
              (rows.length !== 5 || rows.some((row) => !row.complete))
            )
              process.exitCode = 1;
          }
          try {
            const mode = process.argv[2];
            if (mode === "callback") await callback();
            else await execute(mode);
          } catch (error) {
            // Infrastructure failures must not print an assertion's private values/stack.
            console.log(
              JSON.stringify({
                schemaVersion: 1,
                scope: "diagnostic-infrastructure-failure",
                failure: failure(error, []),
                source9Qualified: false,
                fresh9Qualified: false,
                gateAQualified: false,
              }),
            );
            process.exitCode = 1;
          }
          '@
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-diagnostic.mjs'
          Set-Content -LiteralPath $controller -Value $program -Encoding utf8NoBOM
      - name: Diagnose only the original stale callback
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.controller.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-diagnostic.mjs'
          node $controller stale
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure five fixed supervised Node version launches
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.controller.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-diagnostic.mjs'
          node $controller probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized diagnostic metadata only
        if: ${{ !cancelled() && steps.controller.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provenance-original-stale-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-provenance-stale-diagnostic.json
            ${{ runner.temp }}/native-provenance-probe-diagnostic.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
