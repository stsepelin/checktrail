name: Binaryen132 original ARM producer

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Reviewed observation nonce, 8 to 32 lowercase letters or digits
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binaryen132-original-${{ github.ref }}
  cancel-in-progress: false

jobs:
  producer:
    runs-on: macos-15
    timeout-minutes: 355
    env:
      SCRIPT_ROOT: .github/binaryen-producer
      OBSERVATION_NONCE: ${{ inputs.nonce }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind the complete first-party helper cohort to the dispatched commit
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,json,os,pathlib,re,stat,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          prefix=os.environ['SCRIPT_ROOT']
          assert prefix=='.github/binaryen-producer'
          assert re.fullmatch('[a-z0-9]{8,32}',os.environ['OBSERVATION_NONCE'])
          env={**os.environ,'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null'}
          def git(*args):return subprocess.check_output(['git','-c','core.fsmonitor=false','-c','core.hooksPath=/dev/null',*args],cwd=root,env=env)
          assert git('rev-parse','HEAD').decode().strip()==os.environ['GITHUB_SHA']
          entries={}
          for row in git('ls-tree','-rz','HEAD','--',prefix).split(b'\0'):
              if not row:continue
              header,path=row.split(b'\t',1);mode,kind,identity=header.split()
              name=os.fsdecode(path);assert mode==b'100644' and kind==b'blob'
              assert re.fullmatch(re.escape(prefix)+r'/[a-z][a-z0-9_-]+\.(py|json)',name)
              entries[name]=identity.decode()
          assert 7<=len(entries)<=16
          required={'controller.py','capsule.py','prepare_capsule.py','remote_intake.py','metadata_tools.py','recover.py','selection.json','test_controller.py','test_remote_intake.py'}
          assert required<={pathlib.Path(p).name for p in entries}
          actual={str(p.relative_to(root)) for p in (root/prefix).iterdir()}
          assert actual==set(entries)
          rows=[];total=0
          for name,identity in sorted(entries.items()):
              p=root/name;s=p.lstat();assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and p==p.resolve()
              assert s.st_size<=1024*1024
              body=p.read_bytes();total+=len(body);assert total<=8*1024*1024
              assert hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==identity
              rows.append({'path':name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'gitBlob':identity})
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'binaryen-code.json'
          out.write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],'files':rows},indent=2)+'\n')
          PY
      - name: Verify the synthetic controller and refusal controls
        timeout-minutes: 3
        run: |
          python3 -I -B "$SCRIPT_ROOT/test_controller.py"
          python3 -I -B "$SCRIPT_ROOT/test_remote_intake.py"
      - name: Acquire exact official source inputs as inert data
        timeout-minutes: 15
        run: >-
          python3 -I -B "$SCRIPT_ROOT/remote_intake.py"
          --manifest "$SCRIPT_ROOT/selection.json"
          --output "$RUNNER_TEMP/binaryen-intake"
      - name: Validate all eight source and original raw Git objects before materialization
        timeout-minutes: 5
        run: >-
          python3 -I -B "$SCRIPT_ROOT/prepare_capsule.py"
          --parent "$RUNNER_TEMP/binaryen-intake/parent"
          --nested "$RUNNER_TEMP/binaryen-intake/nested"
          --raw-commits "$RUNNER_TEMP/binaryen-intake/raw-commits"
          --output "$RUNNER_TEMP/binaryen-capsule"
      - name: Observe the unchanged selected ARM build commands under the reviewed controller
        timeout-minutes: 285
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()/os.environ['SCRIPT_ROOT']
          capsule=pathlib.Path(os.environ['RUNNER_TEMP'])/'binaryen-capsule'
          receipt=json.loads((capsule/'CAPSULE.json').read_text())
          assert receipt['capsule']['file']=='capsule.tar.gz'
          run=os.environ['GITHUB_RUN_ID'];nonce=os.environ['OBSERVATION_NONCE']
          assert re.fullmatch('[0-9]+',run) and re.fullmatch('[a-z0-9]{8,32}',nonce)
          work='/private/tmp/checktrail-binaryen-'+run+'-'+nonce
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('BINARYEN_CAPTURE_DIR='+work+'/capture\n')
          allowed=['PATH','DEVELOPER_DIR','GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_ARCH','GITHUB_RUN_ID','GITHUB_SHA','GITHUB_REPOSITORY','GITHUB_EVENT_NAME','ImageVersion','ImageOS','GITHUB_WORKSPACE','RUNNER_TEMP','GITHUB_ENV','GITHUB_OUTPUT','GITHUB_PATH','GITHUB_STATE','GITHUB_STEP_SUMMARY']
          native_env=[k+'='+os.environ[k] for k in allowed if k in os.environ]
          command=['sudo','-n','/usr/bin/env','-i',*native_env,'SUDO_UID='+str(os.getuid()),'/usr/bin/python3','-I','-B',str(root/'controller.py'),'observe','--capsule',str(capsule/'capsule.tar.gz'),'--sha256',receipt['capsule']['sha256'],'--bytes',str(receipt['capsule']['bytes']),'--work',work]
          raise SystemExit(subprocess.run(command,check=False).returncode)
          PY
      - name: Retain metadata, original selected source notices, bounded logs and native output
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import os,pathlib,re,subprocess
          run=os.environ['GITHUB_RUN_ID'];nonce=os.environ['OBSERVATION_NONCE']
          assert re.fullmatch('[0-9]+',run) and re.fullmatch('[a-z0-9]{8,32}',nonce)
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()/os.environ['SCRIPT_ROOT']
          command=['sudo','-n','/usr/bin/env','-i','PATH=/usr/bin:/bin','GITHUB_ACTIONS=true','GITHUB_EVENT_NAME=workflow_dispatch','GITHUB_RUN_ID='+run,'GITHUB_SHA='+os.environ['GITHUB_SHA'],'/usr/bin/python3','-I','-B',str(root/'controller.py'),'stage-capture','--work','/private/tmp/checktrail-binaryen-'+run+'-'+nonce]
          raise SystemExit(subprocess.run(command,check=False).returncode)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 20
        with:
          name: binaryen132-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/binaryen-code.json
            ${{ runner.temp }}/binaryen-host-admission.json
            ${{ runner.temp }}/binaryen-intake/INTAKE.json
            ${{ env.BINARYEN_CAPTURE_DIR }}
          if-no-files-found: error
          retention-days: 1
      - name: Remove only the quiescent owned producer workspace
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import os,pathlib,re,subprocess
          run=os.environ['GITHUB_RUN_ID'];nonce=os.environ['OBSERVATION_NONCE']
          assert re.fullmatch('[0-9]+',run) and re.fullmatch('[a-z0-9]{8,32}',nonce)
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()/os.environ['SCRIPT_ROOT']
          command=['sudo','-n','/usr/bin/env','-i','PATH=/usr/bin:/bin','GITHUB_ACTIONS=true','GITHUB_EVENT_NAME=workflow_dispatch','GITHUB_RUN_ID='+run,'GITHUB_SHA='+os.environ['GITHUB_SHA'],'/usr/bin/python3','-I','-B',str(root/'controller.py'),'cleanup','--work','/private/tmp/checktrail-binaryen-'+run+'-'+nonce]
          raise SystemExit(subprocess.run(command,check=False).returncode)
          PY
