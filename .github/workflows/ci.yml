# FIRST-PARTY INERT CONTROLS. No original SDK/source/seed/build/test/key action.
name: SDK10 protected supervisor controls
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Exact reviewed fresh inert-controls nonce
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: checktrail-sdk10-protected-supervisor-controls
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    env:
      CHECKTRAIL_NONCE: ${{ inputs.nonce }}
      CHECKTRAIL_MANIFEST_SHA256: fc98c3cfbcc11a74e3059707bd526ca949f84543b237de7c2318f4c4c6872bef
      CHECKTRAIL_CONTROL_MANIFEST_SHA256: 3d6150382c1a12078fe0817418a27dab9b645dec87a7f24ca87f425dfaf48993
    steps:
      - name: Read exact reviewed first-party source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Broken and valid first-party causal controls without Docker
        shell: bash
        run: |
          python3 -I -S -B scripts/producer-sdk10/test_producer_adapter.py
          python3 -I -S -B scripts/producer-sdk10/test_native_identity.py
          python3 -I -S -B scripts/producer-sdk10/test_supervisor_authority.py
          python3 -I -S -B scripts/producer-sdk10/test_protected_control_target.py
      - name: Actual owned root0700 copy and cross-UID supervisor controls
        shell: bash
        run: python3 -I -S -B scripts/producer-sdk10/target_protected_controls.py --nonce "$CHECKTRAIL_NONCE" --manifest-sha256 "$CHECKTRAIL_MANIFEST_SHA256" --control-manifest-sha256 "$CHECKTRAIL_CONTROL_MANIFEST_SHA256"
      - name: Retain bounded first-party RESULT metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk10-protected-controls-${{ github.run_id }}-1-${{ inputs.nonce }}
          path: ${{ runner.temp }}/ct-sdk10-protected-controls-${{ inputs.nonce }}/RESULT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
