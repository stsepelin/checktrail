name: Native resource diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpu-guards:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "22.23.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Require native paired guards
        run: node scripts/verify-windows-resource-guards.mjs
      - name: Repeat native paired guards under controlled CPU competition
        run: node scripts/diagnose-windows-cpu-guards.mjs
