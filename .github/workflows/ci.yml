# REVIEW ONLY. Do not publish/dispatch before the complete carrier review.
# Replacement ci.yml on the existing manual diagnostic branch, workflow 363121286.
name: GCC original SDK reconstruction diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gcc-hosted-configure-checkpoint
  cancel-in-progress: false
jobs:
  gcc-staged-first:
    if: github.repository == 'stsepelin/checktrail' && startsWith(github.ref, 'refs/heads/diagnostic/')
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare exact authenticated original inputs
        timeout-minutes: 55
        run: |
          docker pull --platform linux/amd64 docker.io/coqorg/coq@sha256:1f69b9224f068d408e6be7a3f536f67395d00c3497b97bdb99ee2d2c4c91954c
          node scripts/acquire-binutils-inputs.mjs --output "$RUNNER_TEMP/gcc-common-inputs" --operator-trust-execution
          node scripts/acquire-c-producer-inputs.mjs --profile gcc-12 --common-inputs "$RUNNER_TEMP/gcc-common-inputs/bundle" --output "$RUNNER_TEMP/gcc-inputs"
      - name: Restore the independently pinned configure predecessor
        id: predecessor
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gcc-phase0-transport
          key: gcc-phase0-9b237f06213d06bca5f94340c59bd40b2dccccd3-44140525465-1
          fail-on-cache-miss: true
      - name: Reconstruct and compare the original SDK without a GCC target
        timeout-minutes: 50
        env:
          CHECKTRAIL_GITHUB_JOB_TOKEN: ${{ github.token }}
          CHECKTRAIL_PREDECESSOR_CACHE_HIT: ${{ steps.predecessor.outputs.cache-hit }}
        run: |
          CHECKTRAIL_HOST_NODE="$(node --input-type=module --eval 'import { readFileSync, realpathSync } from "node:fs"; import { createHash } from "node:crypto"; const path = realpathSync(process.execPath); process.stdout.write(JSON.stringify({path, sha256: createHash("sha256").update(readFileSync(path)).digest("hex"), version: process.version}));')"
          export CHECKTRAIL_HOST_NODE
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,RUNNER_TEMP,CHECKTRAIL_GITHUB_JOB_TOKEN,CHECKTRAIL_HOST_NODE,CHECKTRAIL_PREDECESSOR_CACHE_HIT \
            python3 -I -B scripts/producer-qualification/gcc-hosted-sdk.py \
            --repository "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/gcc-inputs/bundle" \
            --output "$RUNNER_TEMP/gcc-sdk-reconstruction" --operator-trust-execution
      - name: Retain bounded SDK reconstruction diagnostics
        if: always()
        timeout-minutes: 5
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,RUNNER_TEMP
          python3 -I -B scripts/producer-qualification/gcc-hosted-sdk.py
          --repository "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/gcc-inputs/bundle"
          --output "$RUNNER_TEMP/gcc-sdk-reconstruction" --mode export-diagnostics
      - name: Upload bounded SDK reconstruction metadata
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-sdk-reconstruction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gcc-sdk-diagnostics
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
