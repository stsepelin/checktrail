name: Windows resource preparation ACL diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  resource-acl:
    name: First resource preparation ACL (${{ matrix.mode }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode:
          - cold-original
          - cold-instrumented
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: fe6461e3da07959bc040dba14134dc102885a0ef
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Prepare pinned production installation cache
        run: node scripts/prepare-package-cache.mjs
      - name: Write fixed diagnostic bytes
        shell: pwsh
        timeout-minutes: 1
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'checktrail-resource-acl-probe.mjs'
          $bytes = [Convert]::FromBase64String('')
          $stream = [System.IO.File]::Open($entry, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try { $stream.Write($bytes, 0, $bytes.Length) } finally { $stream.Dispose() }
      - name: Complete fixed diagnostic bytes
        shell: pwsh
        timeout-minutes: 1
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'checktrail-resource-acl-probe.mjs'
          $bytes = [Convert]::FromBase64String('')
          $stream = [System.IO.File]::Open($entry, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try { $stream.Write($bytes, 0, $bytes.Length) } finally { $stream.Dispose() }
      - name: Observe first original resource preparation protection only
        timeout-minutes: 2
        shell: pwsh
        env:
          CHECKTRAIL_ACL_PROBE_RECEIPT: ${{ runner.temp }}\resource-release-acl.json
          CHECKTRAIL_ACL_PROBE_MODE: ${{ matrix.mode }}
        run: |
          $entry = Join-Path $env:RUNNER_TEMP 'checktrail-resource-acl-probe.mjs'
          if ((Get-FileHash -LiteralPath $entry -Algorithm SHA256).Hash.ToLowerInvariant() -ne '76ac4283d9b9d9e628fd6513cf08d99fc41a03a43b0ce27046015bbb7e19e591') { throw 'Fixed diagnostic transport hash mismatch' }
          node $entry $env:CHECKTRAIL_ACL_PROBE_MODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain bounded diagnostic metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resource-release-acl-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\resource-release-acl.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
