# Diagnostic-only branch. Never merge this workflow replacement.
name: Diagnose PR145 lifecycle readiness
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: diagnostic-ci145-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Diagnose lifecycle (${{ matrix.slot }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: ci-macos-node26
            os: macos-26
            node: 26.9.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.slot == 'windows-node22' && 45 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Install bounded lifecycle phase diagnostics
        run: node scripts/diagnose-lifecycle-readiness.mjs install
      - name: Diagnose native Windows private-access setup boundaries
        if: matrix.slot == 'windows-node22'
        run: node scripts/diagnose-windows-task-access.mjs
      - name: Prepare pinned production installation cache
        run: node scripts/prepare-package-cache.mjs
      - name:
          Require source and retained fresh-install controls with exact runtime and
          observed image identity
        run: node scripts/verify-tasks-runtime.mjs ${{ matrix.slot }}
      - name: Require runtime selection and installation admission controls
        run:
          node scripts/verify-required-native-tests.mjs review-runtime-bindings
          probe-workspace-privacy
      - name:
          Require whole candidate workflow source and offline installed runtime
          evidence
        run: node scripts/verify-review-runtime.mjs ${{ matrix.slot }}
      - name: Require lifecycle runtime admission and source/fresh controls
        run: >
          node scripts/verify-required-native-tests.mjs
          lifecycle-runtime-bindings

          node scripts/verify-lifecycle-platforms.mjs ${{ matrix.slot }}
      - name: Retain phase observations and restore compiled helper
        if: ${{ always() }}
        run: node scripts/diagnose-lifecycle-readiness.mjs finish
