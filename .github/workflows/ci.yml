name: Focused Windows verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Record native Windows profile identity
        shell: pwsh
        run: |
          node --version
          [Environment]::OSVersion.VersionString
          $env:ImageVersion
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable | ConvertTo-Json -Depth 3'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Diagnose original native Windows startup
        run: node scripts/probe-windows-startup-stages.mjs
      - name: Require native Windows argument environment process tree and shared engine controls
        run: node scripts/verify-required-native-tests.mjs windows-process
      - name: Require physical process output controls on native Windows
        run: node scripts/verify-required-native-tests.mjs physical-process-output
      - name: Require actual native namespace cleanup races and exhausted refusal
        run: node scripts/verify-required-native-tests.mjs native-harness-cleanup
      - name: Require native compiling mutation guards with unchanged callbacks
        run: node scripts/verify-windows-guards.mjs
      - name: Require native Windows workload and accounting controls
        run: node scripts/verify-required-native-tests.mjs windows-resource-workload-bindings windows-resource-workloads
      - name: Require native resource counter and fixed-source integrity guards
        run: node scripts/verify-windows-resource-guards.mjs
      - name: Require native workspace privacy before bootstrap data
        run: node scripts/verify-windows-workspace-guard.mjs
      - run: npm run format:check
      - name: Prepare package install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - name: Repeat original controls in an offline locked production installation
        run: node scripts/verify-windows-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-startup-stages-${{ matrix.os }}
          path: ${{ runner.temp }}/windows-startup-stages.json
          if-no-files-found: warn
