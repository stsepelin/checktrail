name: Verify

on:
  push:
    branches-ignore:
      - "pr/**"
    tags:
      - "**"
  pull_request:

# Each PR retains its latest merge-candidate run. Other pushes have unique groups.
# This groups workflow runs, not the independent jobs within each run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: none
      - name: Verify required toolchains
        run: |
          node --version
          go version
          python3 --version
          php --version
      - name: Prepare pinned Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.98.1 wasm32-unknown-unknown
          dirname "$(rustup which --toolchain 1.98.1 rustc)" >> "$GITHUB_PATH"
      - name: Prepare pinned Go analyzers
        run: |
          mkdir -p .checktrail/go-tools/bin
          GOBIN="$PWD/.checktrail/go-tools/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          .checktrail/go-tools/bin/staticcheck -version
          GOBIN="$PWD/.checktrail/go-tools/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          .checktrail/go-tools/bin/golangci-lint version --short
      - name: Prepare locked PHP test tools
        run: |
          mkdir -p .checktrail/php-tools
          cp scripts/php-tools/composer.json scripts/php-tools/composer.lock .checktrail/php-tools/
          composer install --working-dir=.checktrail/php-tools --no-interaction --no-scripts --prefer-dist --no-progress
      - name: Prepare locked PHP review tools
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          composer install --working-dir=.checktrail/php-review-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Prepare locked Laravel runtime fixtures
        run: |
          mkdir -p .checktrail/laravel-tools
          cp scripts/laravel-tools/composer.json scripts/laravel-tools/composer.lock .checktrail/laravel-tools/
          composer install --working-dir=.checktrail/laravel-tools --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - run: python3 -m pip install -r scripts/python-tools.requirements.txt
      - run: python3 -m pip install -r scripts/framework-tools.requirements.txt
      - run: npm ci --ignore-scripts
      - name: Prepare locked legacy TypeScript compiler
        run: |
          mkdir -p .checktrail/typescript-legacy-tools
          cp scripts/typescript-legacy-tools/package.json scripts/typescript-legacy-tools/package-lock.json .checktrail/typescript-legacy-tools/
          npm ci --prefix .checktrail/typescript-legacy-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Vue Router fixtures
        run: |
          mkdir -p .checktrail/vue-router-tools
          cp scripts/vue-router-tools/package.json scripts/vue-router-tools/package-lock.json .checktrail/vue-router-tools/
          npm ci --prefix .checktrail/vue-router-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare locked Nuxt fixtures
        run: |
          mkdir -p .checktrail/nuxt-tools
          cp scripts/nuxt-tools/package.json scripts/nuxt-tools/package-lock.json .checktrail/nuxt-tools/
          npm ci --prefix .checktrail/nuxt-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned Chromium for native browser fixtures
        run: PLAYWRIGHT_BROWSERS_PATH=.checktrail/playwright-browsers node node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - run: npm run check
      - name: Require prepared native regression profiles
        run: |
          node scripts/verify-required-native-tests.mjs core
          node scripts/verify-required-native-tests.mjs native-process-observer
          node scripts/verify-required-native-tests.mjs mcp-tasks-routing
          node scripts/verify-required-native-tests.mjs mcp-tasks
          node scripts/verify-required-native-tests.mjs mcp-task-dispatch
          CHECKTRAIL_TEST_TASKS=1 node --test dist/test/mcp.test.js
          node scripts/verify-required-native-tests.mjs javascript
          node scripts/verify-required-native-tests.mjs python
          node scripts/verify-required-native-tests.mjs frameworks
          node scripts/verify-required-native-tests.mjs go
          node scripts/verify-required-native-tests.mjs php-tools
          node scripts/verify-required-native-tests.mjs php-review
          node scripts/verify-required-native-tests.mjs laravel
          node scripts/verify-required-native-tests.mjs rust
          node scripts/verify-required-native-tests.mjs rust-format
          node scripts/verify-required-native-tests.mjs clippy
          node scripts/verify-required-native-tests.mjs rust-tests
          node scripts/verify-required-native-tests.mjs rust-workspace
          node scripts/verify-required-native-tests.mjs review-budget
          node scripts/verify-required-native-tests.mjs review-workflow
          node scripts/verify-required-native-tests.mjs review-workflow-audit
          node scripts/verify-required-native-tests.mjs review-benchmark
          node scripts/verify-required-native-tests.mjs review-benchmark-judging
          node scripts/verify-required-native-tests.mjs review-native-budget
      - run: npm run format:check
      - run: node scripts/audit-dependencies.mjs
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/smoke-package.mjs
      - name: Verify aggregate review budgets in the production package
        run: node scripts/verify-review-budget-package.mjs
      - name: Verify model-independent workflow in the production package
        run: node scripts/verify-review-workflow-package.mjs
      - name: Verify durable workflow audits in the production package
        run: node scripts/verify-review-workflow-audit-package.mjs
      - name: Verify sealed synthetic benchmark intake in the production package
        run: node scripts/verify-review-benchmark-package.mjs
      - name: Verify installed MCP Tasks lifecycle offline on the host
        run: node scripts/verify-mcp-tasks-package.mjs
      - name: Verify installed PHP review profiles offline on the host
        run: node scripts/verify-php-review-package.mjs
      - name: Verify installed Rust formatting offline on the host
        run: node scripts/verify-rust-format-package.mjs
      - name: Verify installed Clippy analysis offline on the host
        run: node scripts/verify-clippy-package.mjs
      - name: Verify installed Rust test execution offline on the host
        run: node scripts/verify-rust-test-package.mjs
      - name: Verify installed Rust workspace profiles offline on the host
        run: node scripts/verify-rust-workspace-package.mjs
      - name: Verify repeated Go profiles in the production package
        run: node scripts/verify-go-matrix-package.mjs
      - name: Prepare pinned review runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: docker build --file scripts/review-tools.Dockerfile --tag checktrail-review-tools:finish-first-v1 scripts
      - name: Verify review exchange in the packaged Linux runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/verify-review-container.mjs
      - name: Verify task storage and execution in the packaged Linux runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/verify-task-store-container.mjs
      - name: Verify installed MCP Tasks lifecycle offline in Linux
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: CHECKTRAIL_TASKS_IMAGE=node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 node scripts/verify-mcp-tasks-package.mjs

  php-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned PHP runtime
        run: docker build --file scripts/php-review-tools.Dockerfile --tag checktrail-php-review:synthetic-v1 scripts
      - name: Prepare locked native tools without project lifecycles
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          docker run --rm --mount "type=bind,src=$PWD/.checktrail/php-review-tools,target=/tools" --workdir /tools checktrail-php-review:synthetic-v1 composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Require native PHP evidence offline
        run: docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-php-review:synthetic-v1 node scripts/verify-required-native-tests.mjs php-review
      - name: Audit installed PHP review metadata and notices
        run: node scripts/audit-php-review-tools.mjs
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - name: Require installed PHP review evidence offline
        run: CHECKTRAIL_PHP_REVIEW_IMAGE=checktrail-php-review:synthetic-v1 node scripts/verify-php-review-package.mjs

  clang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned Clang fixture
        run: docker build --file scripts/clang-tools.Dockerfile --tag checktrail-clang-test:22.1.3 scripts
      - run: node scripts/verify-clang-container.mjs

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned Java fixture
        run: docker build --file scripts/java-tools.Dockerfile --tag checktrail-java-test:25.0.4 scripts
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-java-container.mjs

  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned Checkstyle artifact
        run: node scripts/prepare-java-review-tools.mjs
      - name: Prepare pinned Checkstyle runtime
        run: docker build --file scripts/java-review-tools.Dockerfile --tag checktrail-checkstyle-test:14.3.0 .checktrail/jvm-review-tools
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-checkstyle-container.mjs

  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-maven-tools.mjs
      - run: docker build --file scripts/maven-tools.Dockerfile --tag checktrail-maven-test:3.10.0 .checktrail/maven-review-tools
      - run: node scripts/prepare-maven-dependencies.mjs
      - run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-maven-container.mjs

  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-gradle-tools.mjs
      - run: docker build --file scripts/gradle-tools.Dockerfile --tag checktrail-gradle-test:9.8.0 .checktrail/gradle-review-tools
      - run: node scripts/prepare-gradle-dependencies.mjs
      - run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-gradle-container.mjs

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned C# fixture
        run: docker build --file scripts/dotnet-tools.Dockerfile --tag checktrail-dotnet-test:10.0.401 scripts
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-dotnet-container.mjs
      - run: node scripts/prepare-dotnet-build-dependencies.mjs
      - run: node scripts/verify-dotnet-build-container.mjs
      - run: node scripts/verify-dotnet-test-container.mjs
      - run: node scripts/verify-dotnet-format-container.mjs
      - run: node scripts/verify-dotnet-generated-container.mjs
      - run: node scripts/verify-dotnet-method-container.mjs

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned workflow checker
        run: docker build --file scripts/actionlint-tools.Dockerfile --tag checktrail-actionlint-test:1.7.12 scripts
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-actionlint-container.mjs

  external-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned external adapter runtimes
        run: docker build --file scripts/external-tools.Dockerfile --tag checktrail-external-test:1 scripts
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-external-container.mjs
      - name: Prepare pinned bundle verification and native compilation runtimes
        run: docker build --file scripts/executable-bundle-tools.Dockerfile --tag checktrail-executable-bundle-test:1 scripts
      - name: Require packed executable installation and separate trusted execution
        run: |
          docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-executable-bundle-test:1 node scripts/verify-required-native-tests.mjs executable-bundle
          docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-executable-bundle-test:1 node scripts/verify-required-native-tests.mjs executable-bundle-interpreters
          docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-executable-bundle-test:1 node scripts/verify-required-native-tests.mjs external-protocol
          docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-executable-bundle-test:1 node scripts/verify-required-native-tests.mjs policy-distribution
      - name: Verify packed executable adapters in a fresh offline production installation
        env:
          CHECKTRAIL_EXECUTABLE_BUNDLE_IMAGE: checktrail-executable-bundle-test:1
        run: node scripts/verify-executable-bundle-package.mjs

  vue-router:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare locked Vue Router fixtures
        run: |
          mkdir -p .checktrail/vue-router-tools
          cp scripts/vue-router-tools/package.json scripts/vue-router-tools/package-lock.json .checktrail/vue-router-tools/
          npm ci --prefix .checktrail/vue-router-tools --ignore-scripts --no-audit --no-fund
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-vue-router-container.mjs

  nuxt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare locked Nuxt fixtures for the container runtime
        run: |
          mkdir -p .checktrail/nuxt-tools
          cp scripts/nuxt-tools/package.json scripts/nuxt-tools/package-lock.json .checktrail/nuxt-tools/
          docker run --rm --mount "type=bind,src=$PWD/.checktrail/nuxt-tools,target=/tools" --workdir /tools node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-nuxt-container.mjs

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned Ruby and Node runtimes
        run: |
          docker pull ruby@sha256:79bf10b28c9d98b7b3cffda01aba8190aa1c1c48513d205ec93372a0e2f010e3
          docker pull node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - run: node scripts/verify-ruby-container.mjs

  ruby-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHECKTRAIL_TEST_TASK: ci-ruby-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-ruby-tools-runtime.mjs
      - run: node scripts/prepare-ruby-tools-container-dependencies.mjs
      - run: node scripts/verify-ruby-tools-container.mjs
      - if: always()
        run: node scripts/cleanup-ruby-tools-runtime.mjs

  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: swiftc --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/verify-required-native-tests.mjs swift

  swift-tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CHECKTRAIL_TEST_TASK: ci-swift-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-swift-tools-runtime.mjs
      - run: node scripts/prepare-package-cache.mjs
      - run: node scripts/verify-swift-tools-container.mjs
      - if: always()
        run: node scripts/cleanup-swift-tools-runtime.mjs

  cpp-tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CHECKTRAIL_TEST_TASK: ci-cpp-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
