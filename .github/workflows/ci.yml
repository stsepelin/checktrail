          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare pinned public images with bounded delivery retries
        run: |
          node scripts/pull-pinned-image.mjs public.ecr.aws/docker/library/composer@sha256:b09bccd91a78fe8a9ab4b33d707b862e8fe54fec17782e32683ad2a69c46867d
          node scripts/pull-pinned-image.mjs public.ecr.aws/docker/library/node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
      - name: Prepare pinned PHP runtime
        run: docker build --file scripts/php-review-tools.Dockerfile --tag checktrail-php-review:synthetic-v1 scripts
      - name: Prepare locked native tools without project lifecycles
        run: |
          mkdir -p .checktrail/php-review-tools
          cp scripts/php-review-tools/composer.json scripts/php-review-tools/composer.lock .checktrail/php-review-tools/
          docker run --rm --mount "type=bind,src=$PWD/.checktrail/php-review-tools,target=/tools" --workdir /tools checktrail-php-review:synthetic-v1 composer install --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Require native PHP evidence offline
        run: docker run --rm --network none --cpus 2 --memory 2g --mount "type=bind,src=$PWD,target=/workspace,readonly" --workdir /workspace checktrail-php-review:synthetic-v1 node scripts/verify-required-native-tests.mjs php-review
      - name: Audit installed PHP review metadata and notices
        run: node scripts/audit-php-review-tools.mjs
      - name: Prepare package-install cache with network access
        run: node scripts/prepare-package-cache.mjs
      - name: Require installed PHP review evidence offline
        run: CHECKTRAIL_PHP_REVIEW_IMAGE=checktrail-php-review:synthetic-v1 node scripts/verify-php-review-package.mjs

