name: Native provenance diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-provenance-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-same-host-cost-diagnostic:
    name: Windows fixed supervision cost diagnostic
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact reviewed source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stsepelin/checktrail
          ref: de1753a0c662b73fa66df145c05d0539ac839379
          persist-credentials: false
      - name: Set up the original Windows Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the original source normally
        id: build
        run: npm run build
      - name: Prepare the bounded fixed timing controller
        id: controller
        run: |
          $program = @'
          import assert from "node:assert/strict";
          import { Buffer } from "node:buffer";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import {
            lstat,
            mkdir,
            mkdtemp,
            readFile,
            realpath,
            rm,
            writeFile,
          } from "node:fs/promises";
          import path from "node:path";
          import process from "node:process";
          import { performance } from "node:perf_hooks";
          import { setTimeout, clearTimeout } from "node:timers";
          let deadlineTimer;
          import { fileURLToPath, pathToFileURL } from "node:url";
          const SOURCE = "de1753a0c662b73fa66df145c05d0539ac839379";
          const sha = (body) => createHash("sha256").update(body).digest("hex");
          const finite = (number, max = 15000) =>
            typeof number === "number" &&
            Number.isFinite(number) &&
            number >= 0 &&
            number <= max;
          function commandBudget(end, now) {
            assert.ok(Number.isFinite(end) && Number.isFinite(now));
            assert.ok(Math.floor(end - now - 5000) >= 15000);
            return 15000;
          }
          function compileProgram(pin) {
            assert.match(pin.sha256, /^[a-f0-9]{64}$/u);
            assert.ok(
              Number.isSafeInteger(pin.bytes) &&
                pin.bytes > 0 &&
                pin.bytes <= 2 * 1048576,
            );
            return `
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $bodyClock = [Diagnostics.Stopwatch]::StartNew()
          $creationMs = 0.0; $compileMs = 0.0; $typeLoadMs = 0.0
          $errorCount = 0; $warningCount = 0; $typeAvailable = $false; $complete = $false
          $compiler = $null; $parameters = $null
          try {
            [void][Reflection.Assembly]::Load('System.Web.Extensions, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35')
            $ownedDirectory = [Environment]::CurrentDirectory
            $reader = [IO.BinaryReader]::new([IO.File]::Open([IO.Path]::Combine($ownedDirectory,'compile-source.cs'),[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read))
            try { $sourceBytes = $reader.ReadBytes(${pin.bytes + 1}) } finally { $reader.Dispose() }
            $hasher = [Security.Cryptography.SHA256]::Create()
            try { $sourceDigest = [BitConverter]::ToString($hasher.ComputeHash($sourceBytes)).Replace('-','').ToLowerInvariant() } finally { $hasher.Dispose() }
            if ($sourceBytes.Length -ne ${pin.bytes} -or $sourceDigest -ne '${pin.sha256}') { throw 'Pinned fixed source changed' }
            $source = [Text.Encoding]::UTF8.GetString($sourceBytes)
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $compiler = [Microsoft.CSharp.CSharpCodeProvider]::new()
            $parameters = [CodeDom.Compiler.CompilerParameters]::new()
            $parameters.GenerateInMemory = $true
            $parameters.GenerateExecutable = $false
            $parameters.TempFiles = [CodeDom.Compiler.TempFileCollection]::new($ownedDirectory,$false)
            [void]$parameters.ReferencedAssemblies.Add('System.dll')
            [void]$parameters.ReferencedAssemblies.Add('System.Core.dll')
            [void]$parameters.ReferencedAssemblies.Add('System.Web.Extensions.dll')
            $creationMs = $clock.Elapsed.TotalMilliseconds
            $clock.Restart()
            $compiled = $compiler.CompileAssemblyFromSource($parameters,[string[]]@($source))
            $compileMs = $clock.Elapsed.TotalMilliseconds
            foreach ($problem in $compiled.Errors) { if ($problem.IsWarning) { $warningCount++ } else { $errorCount++ } }
            if ($compiled.Errors.HasErrors) { throw 'Fixed source compilation failed' }
            $clock.Restart()
            $type = $compiled.CompiledAssembly.GetType('ChecktrailWindowsJobV1',$true)
            $typeAvailable = $null -ne $type
            $typeLoadMs = $clock.Elapsed.TotalMilliseconds
            $complete = $typeAvailable
          } catch {
            $complete = $false
          } finally {
            if ($null -ne $compiler) { $compiler.Dispose() }
            if ($null -ne $parameters) { $parameters.TempFiles.Delete() }
          }
          $json = [Web.Script.Serialization.JavaScriptSerializer]::new()
          $json.MaxJsonLength = 4096
          [Console]::Out.WriteLine($json.Serialize([ordered]@{sourceSHA256='${pin.sha256}';sourceBytes=${pin.bytes};creationMs=$creationMs;compileMs=$compileMs;typeLoadMs=$typeLoadMs;bodyMs=$bodyClock.Elapsed.TotalMilliseconds;errorCount=$errorCount;warningCount=$warningCount;typeAvailable=$typeAvailable;runInvoked=$false;complete=$complete}))
          if (!$complete) { exit 1 }
          `;
          }
          function parseCompilation(text, pin) {
            try {
              assert.ok(typeof text === "string" && Buffer.byteLength(text) <= 4096);
              const result = JSON.parse(text);
              assert.deepEqual(
                Object.keys(result).sort(),
                [
                  "sourceSHA256",
                  "sourceBytes",
                  "creationMs",
                  "compileMs",
                  "typeLoadMs",
                  "bodyMs",
                  "errorCount",
                  "warningCount",
                  "typeAvailable",
                  "runInvoked",
                  "complete",
                ].sort(),
              );
              assert.equal(result.sourceSHA256, pin.sha256);
              assert.equal(result.sourceBytes, pin.bytes);
              for (const key of ["creationMs", "compileMs", "typeLoadMs", "bodyMs"])
                assert.ok(finite(result[key]));
              assert.ok(
                result.creationMs + result.compileMs + result.typeLoadMs <=
                  result.bodyMs + 1,
              );
              assert.equal(result.errorCount, 0);
              assert.ok(
                Number.isInteger(result.warningCount) &&
                  result.warningCount >= 0 &&
                  result.warningCount <= 1000,
              );
              assert.equal(result.typeAvailable, true);
              assert.equal(result.runInvoked, false);
              assert.equal(result.complete, true);
              return result;
            } catch {
              return null;
            }
          }
          function processMetadata(result) {
            return {
              durationMs: finite(result.durationMs, 20000)
                ? Math.round(result.durationMs)
                : null,
              exitCode:
                Number.isInteger(result.exitCode) &&
                result.exitCode >= 0 &&
                result.exitCode <= 4294967295
                  ? result.exitCode
                  : null,
              timedOut: result.timedOut === true,
              cancelled: result.cancelled === true,
              cleanupConfirmed: result.windowsExecution?.cleanup === "confirmed",
              outputBytes:
                Number.isSafeInteger(result.outputBytes) && result.outputBytes >= 0
                  ? result.outputBytes
                  : null,
              stdoutSHA256: sha(result.stdout ?? ""),
              stderrSHA256: sha(result.stderr ?? ""),
            };
          }
          async function main() {
            const started = performance.now(),
              end = started + 90000;
            const abort = new globalThis.AbortController();
            deadlineTimer = setTimeout(() => abort.abort(), 90000);
            deadlineTimer.unref();
            assert.equal(process.argv.length, 2);
            assert.equal(process.platform, "win32");
            const root = await realpath(process.cwd());
            assert.equal(
              execFileSync("git", ["rev-parse", "HEAD"], {
                encoding: "utf8",
                timeout: 5000,
                maxBuffer: 256,
              }).trim(),
              SOURCE,
            );
            assert.equal(
              execFileSync("git", ["status", "--porcelain=v1", "--untracked-files=no"], {
                encoding: "utf8",
                timeout: 5000,
                maxBuffer: 65536,
              }).trim(),
              "",
            );
            const sourceFiles = [
              "dist/src/runner.js",
              "dist/src/windows-process.js",
              "dist/src/windows-native.js",
              "dist/src/windows-task-access.js",
            ];
            const capture = async () =>
              Promise.all(
                sourceFiles.map(async (local) => {
                  const body = await readFile(path.join(root, local));
                  return { id: local, bytes: body.length, sha256: sha(body) };
                }),
              );
            const before = await capture();
            const runtimeFile = await realpath(process.execPath),
              runtimeSHA256 = sha(await readFile(runtimeFile));
            const { runProcess } = await import(
              pathToFileURL(path.join(root, "dist/src/runner.js")).href
            );
            const { windowsEnvironment } = await import(
              pathToFileURL(path.join(root, "dist/src/windows-process.js")).href
            );
            const { ensureWindowsTaskAccess } = await import(
              pathToFileURL(path.join(root, "dist/src/windows-task-access.js")).href
            );
            const native = await import(
              pathToFileURL(path.join(root, "dist/src/windows-native.js")).href
            );
            const fixedSource = Buffer.from(native.windowsNativeCode, "utf8"),
              pin = { bytes: fixedSource.length, sha256: sha(fixedSource) };
            assert.equal(pin.sha256, native.windowsNativeSourceSha256);
            const program = compileProgram(pin),
              programSHA256 = sha(program);
            const environment = windowsEnvironment(process.env);
            const powershell = await realpath(
              path.win32.join(
                environment.SYSTEMROOT,
                "System32/WindowsPowerShell/v1.0/powershell.exe",
              ),
            );
            assert.equal((await lstat(powershell)).isFile(), true);
            const powershellSHA256 = sha(await readFile(powershell));
            const directory = await realpath(
              await mkdtemp(path.join(process.env.RUNNER_TEMP, "ct-windows-same-host-")),
            );
            const rows = [];
            let failureStage = 0,
              activeStage = 0;
            let complete = false,
              cleanupComplete;
            const budget = () => {
              abort.signal.throwIfAborted();
              return commandBudget(end, performance.now());
            };
            try {
              for (let sample = 0; sample < 2; sample++) {
                activeStage = 1;
                budget(); // Original synchronous ACL inspector has its own15s bound.
                const aclStart = performance.now();
                ensureWindowsTaskAccess(directory, "directory", sample === 0);
                rows.push({
                  stage: 1,
                  sample,
                  durationMs: Math.round(performance.now() - aclStart),
                  complete: true,
                });
                activeStage = 2;
                const directStart = performance.now();
                let rawComplete = false,
                  rawStatus = null,
                  rawStdout = "",
                  rawStderr = "";
                try {
                  rawStdout = execFileSync(runtimeFile, ["--version"], {
                    cwd: directory,
                    env: environment,
                    encoding: "utf8",
                    windowsHide: true,
                    timeout: budget(),
                    maxBuffer: 4096,
                  });
                  rawStatus = 0;
                  rawComplete = rawStdout.trim() === process.version;
                } catch (error) {
                  rawStatus = typeof error.status === "number" ? error.status : null;
                  rawStdout = String(error.stdout ?? "");
                  rawStderr = String(error.stderr ?? "");
                }
                rows.push({
                  stage: 2,
                  sample,
                  durationMs: Math.round(performance.now() - directStart),
                  exitCode: rawStatus,
                  stdoutSHA256: sha(rawStdout),
                  stderrSHA256: sha(rawStderr),
                  complete: rawComplete,
                });
                if (!rawComplete) break;
                activeStage = 3;
                const version = await runProcess(
                  directory,
                  { executable: runtimeFile, args: ["--version"], cwd: "." },
                  { timeoutMs: budget(), maxOutputBytes: 4096, signal: abort.signal },
                );
                const versionComplete =
                  version.exitCode === 0 &&
                  !version.errorCode &&
                  !version.timedOut &&
                  !version.cancelled &&
                  !version.truncated &&
                  version.stdout.trim() === process.version &&
                  version.stderr === "" &&
                  version.windowsExecution?.cleanup === "confirmed";
                rows.push({
                  stage: 3,
                  sample,
                  ...processMetadata(version),
                  complete: versionComplete,
                });
                if (!versionComplete) break;
                activeStage = 4;
                const compileDirectory = path.join(directory, `compile-${sample}`);
                await mkdir(compileDirectory);
                const input = path.join(compileDirectory, "compile-source.cs");
                await writeFile(input, fixedSource, { flag: "wx", mode: 0o600 });
                const result = await runProcess(
                  directory,
                  {
                    executable: powershell,
                    args: [
                      "-NoProfile",
                      "-NonInteractive",
                      "-EncodedCommand",
                      Buffer.from(program, "utf16le").toString("base64"),
                    ],
                    cwd: `compile-${sample}`,
                  },
                  { timeoutMs: budget(), maxOutputBytes: 4096, signal: abort.signal },
                );
                const compilation = parseCompilation(result.stdout, pin);
                const compileComplete = Boolean(
                  compilation &&
                  result.exitCode === 0 &&
                  !result.errorCode &&
                  !result.timedOut &&
                  !result.cancelled &&
                  !result.truncated &&
                  result.stderr === "" &&
                  result.windowsExecution?.cleanup === "confirmed",
                );
                rows.push({
                  stage: 4,
                  sample,
                  ...processMetadata(result),
                  compilation,
                  complete: compileComplete,
                });
                assert.equal(sha(await readFile(input)), pin.sha256);
                if (!compileComplete) break;
              }
              assert.deepEqual(await capture(), before);
              assert.equal(sha(await readFile(runtimeFile)), runtimeSHA256);
              assert.equal(sha(await readFile(powershell)), powershellSHA256);
              complete = rows.length === 8 && rows.every((row) => row.complete);
            } catch {
              failureStage = activeStage;
            } finally {
              try {
                await rm(directory, {
                  recursive: true,
                  force: true,
                  maxRetries: 3,
                  retryDelay: 100,
                });
                cleanupComplete = await lstat(directory).then(
                  () => false,
                  (error) => error.code === "ENOENT",
                );
              } catch {
                cleanupComplete = false;
              }
            }
            const result = {
              schemaVersion: 1,
              scope: "same-host-fixed-Windows-setup-timing-only",
              sourceCommit: SOURCE,
              runtime: {
                node: process.versions.node,
                architecture: process.arch,
                nodeSHA256: runtimeSHA256,
                powershellSHA256,
              },
              sourceFiles: before,
              fixedCSharpSource: pin,
              compileProgramSHA256: programSHA256,
              controllerSHA256: sha(await readFile(fileURLToPath(import.meta.url))),
              durationMs: Math.round(performance.now() - started),
              rows,
              complete,
              failureStage,
              cleanupComplete,
              historicalColdStartClaimed: false,
              originalCallbacksExecuted: false,
              excludedOriginalCasesUncredited: 9,
              source9Qualified: false,
              fresh9Qualified: false,
              gateAQualified: false,
              rawBodiesEmitted: false,
            };
            await writeFile(
              path.join(process.env.RUNNER_TEMP, "native-provenance-same-host-cost.json"),
              JSON.stringify(result) + "\n",
              { flag: "wx", mode: 0o600 },
            );
            process.stdout.write(JSON.stringify(result) + "\n");
            if (!complete || !cleanupComplete) process.exitCode = 1;
          }
          try {
            await main();
          } catch {
            process.stdout.write(
              JSON.stringify({
                schemaVersion: 1,
                scope: "same-host-timing-infrastructure-incomplete",
                complete: false,
                source9Qualified: false,
                fresh9Qualified: false,
                gateAQualified: false,
                rawBodiesEmitted: false,
              }) + "\n",
            );
            process.exitCode = 1;
          } finally {
            if (deadlineTimer) clearTimeout(deadlineTimer);
          }
          '@
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-cost-diagnostic.mjs'
          Set-Content -LiteralPath $controller -Value $program -Encoding utf8NoBOM
      - name: Measure only fixed same-host setup costs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.controller.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-cost-diagnostic.mjs'
          node $controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain numeric timing and hash metadata only
        if: ${{ !cancelled() && steps.controller.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provenance-same-host-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-provenance-same-host-cost.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
