name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust198-sla-metadata-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust198-sla-path-metadata:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install only verified first-party metadata controller
        shell: bash
        env:
          COHORT_SHA256: ce69a14ff98ae6e676555c82108c4a0b08ec79d5361cf8f55ac28e3e77480ab6
        run: |
          set -euo pipefail
          control="/opt/checktrail-rust198-sla-controller-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${GITHUB_SHA:0:12}"
          sudo /usr/bin/python3 -I -B - "$GITHUB_WORKSPACE/.github/native-rust198-sla" "$control" "$COHORT_SHA256" <<'PYINSTALL'
          from pathlib import Path
          import hashlib,json,os,re,stat,sys
          source,dest,pin=Path(sys.argv[1]).resolve(strict=True),Path(sys.argv[2]),sys.argv[3]
          raw=(source/'PUBLIC-COHORT.json').read_bytes();assert len(raw)<=65536 and hashlib.sha256(raw).hexdigest()==pin
          rows=json.loads(raw);assert len(rows)==7
          inputs=[];names=set()
          for row in rows:
              name=row['file'];assert re.fullmatch('[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*',name) and all(x not in ('.','..') for x in name.split('/')) and name not in names
              names.add(name);file=source/name;s=file.lstat();assert file==file.resolve(strict=True) and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_size==row['bytes'];body=file.read_bytes();assert hashlib.sha256(body).hexdigest()==row['sha256'];inputs.append((name,body))
          parent=Path('/opt');assert parent==parent.resolve(strict=True) and parent.lstat().st_uid==0 and parent.is_dir() and dest.parent==parent and not os.path.lexists(dest)
          dest.mkdir(mode=0o700)
          for name,body in inputs+[('PUBLIC-COHORT.json',raw)]:
              file=dest/name;file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(body);file.chmod(0o444)
          for folder in dest.rglob('*'):
              if folder.is_dir():folder.chmod(0o555)
          dest.chmod(0o555)
          PYINSTALL
          echo "SLA_CONTROL=$control" >> "$GITHUB_ENV"
      - name: Run 49 synthetic controls on read-only first-party controller
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$SLA_CONTROL/test_resolve_sla.py" -v
      - name: Check existing hosted first-party crypto runtime before metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata_node="$(command -v node)"
          test -x "$metadata_node"
          metadata_node_dir="$(dirname "$metadata_node")"
          echo "METADATA_NODE_DIR=$metadata_node_dir" >> "$GITHUB_ENV"
          sudo /usr/bin/env -i PATH="$metadata_node_dir:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" RUNNER_ARCH="$RUNNER_ARCH" /usr/bin/python3 -I -B "$SLA_CONTROL/metadata_custody.py" preflight --recipient-sha256 16761973a711a9d13b26192dc56c53dd5f5dd3e6a921924ff35f8c3bea92808c
      - name: Resolve only finite original Xcode path metadata
        id: resolver
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH=/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" RUNNER_ARCH="$RUNNER_ARCH" /usr/bin/python3 -I -B "$SLA_CONTROL/resolve_sla.py" --expected-source-sha256 c5c2e766cb92fa265133d64bef854dc93c60c79f76911db47d83cfbc21cbb324
      - name: Encrypt only existing fixed metadata JSON
        id: encrypted
        if: ${{ always() && steps.controls.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/env -i PATH="$METADATA_NODE_DIR:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" RUNNER_ARCH="$RUNNER_ARCH" /usr/bin/python3 -I -B "$SLA_CONTROL/metadata_custody.py" seal --recipient-sha256 16761973a711a9d13b26192dc56c53dd5f5dd3e6a921924ff35f8c3bea92808c --source-outcome '${{ steps.resolver.outcome }}'
          echo "directory=/opt/checktrail-rust198-sla-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${GITHUB_SHA:0:12}/encrypted" >> "$GITHUB_OUTPUT"
      - name: Retain one encrypted metadata artifact for one day
        if: ${{ always() && steps.encrypted.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust198-sla-meta-${{ github.run_id }}-1-rust198-sla-meta-1118-v1
          path: |
            ${{ steps.encrypted.outputs.directory }}/metadata.ctenc
            ${{ steps.encrypted.outputs.directory }}/ENVELOPE.json
            ${{ steps.encrypted.outputs.directory }}/READY.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Preserve actual resolver failure after encrypted diagnostic custody
        if: ${{ always() && steps.resolver.outcome != 'success' }}
        shell: bash
        run: |
          exit 1
