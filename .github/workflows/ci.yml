name: Native provenance diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-provenance-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-termination-discriminator:
    name: Windows fixed launcher termination discriminator
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact reviewed application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stsepelin/checktrail
          ref: de1753a0c662b73fa66df145c05d0539ac839379
          persist-credentials: false
      - name: Set up the original Windows Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the original source normally
        id: build
        run: npm run build
      - name: Prepare the fixed termination discriminator
        id: controller
        run: |
          $program = @'
          import assert from "node:assert/strict";
          import { Buffer } from "node:buffer";
          import { createHash } from "node:crypto";
          import { execFileSync, spawnSync } from "node:child_process";
          import { lstat, readFile, realpath, writeFile } from "node:fs/promises";
          import path from "node:path";
          import process from "node:process";
          import { performance } from "node:perf_hooks";
          import { gzipSync } from "node:zlib";
          import { fileURLToPath, pathToFileURL } from "node:url";
          const SOURCE = "de1753a0c662b73fa66df145c05d0539ac839379";
          const hash = (body) => createHash("sha256").update(body).digest("hex");
          function wireStatus(status) {
            if (!Number.isInteger(status) || status < -2147483648 || status > 4294967295)
              return null;
            return status < 0 ? status + 4294967296 : status;
          }
          function targets() {
            return [
              { kind: 0, value: 0, program: "[Environment]::Exit(0)" },
              { kind: 1, value: 0, program: "exit 0" },
              { kind: 2, value: 0, program: "$null = 0" },
              { kind: 0, value: 37, program: "[Environment]::Exit(37)" },
              { kind: 1, value: 37, program: "exit 37" },
              { kind: 0, value: -1, program: "[Environment]::Exit(-1)" },
              { kind: 1, value: -1, program: "exit -1" },
              { kind: 3, value: 0, program: "$host.SetShouldExit(0)" },
              { kind: 3, value: 37, program: "$host.SetShouldExit(37)" },
              { kind: 3, value: -1, program: "$host.SetShouldExit(-1)" },
            ];
          }
          function fixedTarget(target) {
            assert.ok(target && [0, 1, 2, 3].includes(target.kind));
            assert.ok([0, 37, -1].includes(target.value));
            const expected =
              target.kind === 0
                ? `[Environment]::Exit(${target.value})`
                : target.kind === 1
                  ? `exit ${target.value}`
                  : target.kind === 3
                    ? `$host.SetShouldExit(${target.value})`
                    : "$null = 0";
            assert.equal(target.program, expected);
            if (target.kind === 2) assert.equal(target.value, 0);
            return target;
          }
          function wrappedProgram(original, originalCompressed, target) {
            fixedTarget(target);
            assert.ok(
              typeof original === "string" && Buffer.byteLength(original) <= 65536,
            );
            assert.ok(
              typeof originalCompressed === "string" &&
                /^[A-Za-z0-9+/]+=*$/u.test(originalCompressed),
            );
            const parts = original.split(originalCompressed);
            assert.equal(parts.length, 2);
            const compressed = gzipSync(Buffer.from(target.program, "utf8"), {
              level: 9,
            }).toString("base64");
            return { program: parts[0] + compressed + parts[1], compressed };
          }
          function projection(result, target, durationMs) {
            const stdout = String(result.stdout ?? ""),
              stderr = String(result.stderr ?? "");
            const status = wireStatus(result.status),
              expected = wireStatus(target.value);
            const durationValid =
              Number.isFinite(durationMs) && durationMs >= 0 && durationMs <= 20000;
            const measured =
              !result.error && !result.signal && status !== null && durationValid;
            return {
              kind: target.kind,
              value: target.value,
              durationMs:
                Number.isFinite(durationMs) && durationMs >= 0 && durationMs <= 20000
                  ? Math.round(durationMs)
                  : null,
              rawExitCode: status !== null ? result.status : null,
              unsignedExitCode: status,
              expectedUnsignedExitCode: expected,
              measurementComplete: measured,
              contractMatches:
                measured && status === expected && stdout === "" && stderr === "",
              stdoutBytes: Buffer.byteLength(stdout),
              stderrBytes: Buffer.byteLength(stderr),
              stdoutSHA256: hash(stdout),
              stderrSHA256: hash(stderr),
            };
          }
          function budget(end, now) {
            assert.ok(
              Number.isFinite(end) &&
                Number.isFinite(now) &&
                Math.floor(end - now - 5000) >= 15000,
            );
            return 15000;
          }
          async function main() {
            assert.equal(process.argv.length, 2);
            assert.equal(process.platform, "win32");
            const started = performance.now(),
              end = started + 90000,
              root = await realpath(process.cwd());
            const git = (args) =>
              execFileSync("git", args, {
                encoding: "utf8",
                timeout: 5000,
                maxBuffer: 65536,
                stdio: ["ignore", "pipe", "pipe"],
              }).trim();
            assert.equal(git(["rev-parse", "HEAD"]), SOURCE);
            assert.equal(git(["status", "--porcelain=v1", "--untracked-files=no"]), "");
            const file = path.join(root, "dist/src/windows-native.js"),
              sourceBefore = await readFile(file);
            const { windowsLauncherScript, windowsCompressedSupervisor } = await import(
              pathToFileURL(file).href
            );
            const { windowsEnvironment } = await import(
              pathToFileURL(path.join(root, "dist/src/windows-process.js")).href
            );
            const systemroot = windowsEnvironment(process.env).SYSTEMROOT,
              powershell = await realpath(
                path.win32.join(
                  systemroot,
                  "System32/WindowsPowerShell/v1.0/powershell.exe",
                ),
              );
            assert.equal((await lstat(powershell)).isFile(), true);
            const powershellSHA256 = hash(await readFile(powershell)),
              nodeSHA256 = hash(await readFile(process.execPath));
            const rows = [];
            let failure = false;
            for (const target of targets()) {
              try {
                const wrapped = wrappedProgram(
                    windowsLauncherScript,
                    windowsCompressedSupervisor,
                    target,
                  ),
                  start = performance.now();
                const result = spawnSync(
                  powershell,
                  [
                    "-NoLogo",
                    "-NoProfile",
                    "-NonInteractive",
                    "-EncodedCommand",
                    Buffer.from(wrapped.program, "utf16le").toString("base64"),
                  ],
                  {
                    cwd: root,
                    env: { SYSTEMROOT: systemroot },
                    encoding: "utf8",
                    windowsHide: true,
                    timeout: budget(end, performance.now()),
                    maxBuffer: 4096,
                    stdio: ["ignore", "pipe", "pipe"],
                  },
                );
                rows.push({
                  ...projection(result, target, performance.now() - start),
                  payloadSHA256: hash(target.program),
                  wrappedProgramSHA256: hash(wrapped.program),
                });
                if (!rows.at(-1).measurementComplete) {
                  failure = true;
                  break;
                }
              } catch {
                failure = true;
                break;
              }
            }
            assert.equal(hash(await readFile(file)), hash(sourceBefore));
            assert.equal(hash(await readFile(powershell)), powershellSHA256);
            assert.equal(hash(await readFile(process.execPath)), nodeSHA256);
            const measurementsComplete =
                !failure &&
                rows.length === targets().length &&
                rows.every((row) => row.measurementComplete),
              baselinesMatch =
                rows.filter((row) => row.kind === 0).length === 3 &&
                rows.filter((row) => row.kind === 0).every((row) => row.contractMatches),
              nativeExitAlternativePreservesCodes =
                rows.filter((row) => row.kind === 1).length === 3 &&
                rows.filter((row) => row.kind === 1).every((row) => row.contractMatches),
              hostExitAlternativePreservesCodes =
                rows.filter((row) => row.kind === 3).length === 3 &&
                rows.filter((row) => row.kind === 3).every((row) => row.contractMatches);
            const output = {
              schemaVersion: 1,
              scope: "fixed-original-compressed-launcher-termination-discriminator-only",
              sourceCommit: SOURCE,
              node: process.versions.node,
              nodeSHA256,
              powershellSHA256,
              sourceModuleSHA256: hash(sourceBefore),
              originalLauncherSHA256: hash(windowsLauncherScript),
              controllerSHA256: hash(await readFile(fileURLToPath(import.meta.url))),
              durationMs: Math.round(performance.now() - started),
              rows,
              measurementsComplete,
              baselinesMatch,
              nativeExitAlternativePreservesCodes,
              hostExitAlternativePreservesCodes,
              naturalCompletionMatchesZero:
                rows.find((row) => row.kind === 2)?.contractMatches === true,
              directChildrenReaped: rows.every((row) => row.measurementComplete),
              fixedTargetsCannotSpawnProjectChildren: true,
              originalNamedCallbacksExecuted: false,
              excludedOriginalCasesUncredited: 9,
              source9Qualified: false,
              fresh9Qualified: false,
              gateAQualified: false,
              rawBodiesRetainedInMetadata: false,
            };
            await writeFile(
              path.join(
                process.env.RUNNER_TEMP,
                "native-provenance-termination-cost.json",
              ),
              JSON.stringify(output) + "\n",
              { flag: "wx", mode: 0o600 },
            );
            process.stdout.write(JSON.stringify(output) + "\n");
            if (!measurementsComplete || !baselinesMatch) process.exitCode = 1;
          }
          try {
            await main();
          } catch {
            process.stdout.write(
              JSON.stringify({
                schemaVersion: 1,
                scope: "termination-discriminator-incomplete",
                measurementsComplete: false,
                source9Qualified: false,
                fresh9Qualified: false,
                gateAQualified: false,
                rawBodiesRetainedInMetadata: false,
              }) + "\n",
            );
            process.exitCode = 1;
          }
          '@
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-termination.mjs'
          Set-Content -LiteralPath $controller -Value $program -Encoding utf8NoBOM
      - name: Compare only fixed compressed-launcher exit targets
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.controller.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          $controller = Join-Path $env:RUNNER_TEMP 'native-provenance-termination.mjs'
          node $controller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain bounded numeric statuses and hash observations
        if: ${{ !cancelled() && steps.controller.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provenance-termination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-provenance-termination-cost.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
