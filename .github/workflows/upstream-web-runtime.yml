name: Original web runtime producer observation

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Original publisher recipe
        type: choice
        options:
          - github
          - npm
        default: github
  push:
    branches:
      - "pr/upstream-runtime/web-tree-sitter-*"

permissions:
  contents: read

concurrency:
  group: original-web-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-runtime-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      RUNTIME_RECIPE: ${{ inputs.recipe || 'github' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Admit the observed native host
        run: >-
          node --input-type=module -e
          'import {hostObservation,validateNativeHost} from "./scripts/producer-qualification/web-runtime-controller.mjs"; console.log(JSON.stringify(validateNativeHost(hostObservation())));'
      - name: Reclaim unrelated Android SDK space on the disposable hosted runner
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test ! -L /usr/local/lib/android
          if test -d /usr/local/lib/android; then
            sudo du -s -- /usr/local/lib/android
            sudo rm -rf --one-file-system -- /usr/local/lib/android
          fi
          df -h "$RUNNER_TEMP"
      - name: Acquire the authenticated fixed base explicitly
        run: >-
          docker pull --platform linux/amd64
          docker.io/coqorg/coq@sha256:1f69b9224f068d408e6be7a3f536f67395d00c3497b97bdb99ee2d2c4c91954c
      - name: Acquire and authenticate original public inputs without project execution
        run: >-
          node scripts/producer-qualification/web-runtime-inputs.mjs
          acquire "$RUNNER_TEMP/web-runtime-inputs"
      - name: Assemble the fixed COPY-only compatible runtime
        run: >-
          node scripts/producer-qualification/web-runtime-inputs.mjs
          assemble "$RUNNER_TEMP/web-runtime-inputs" "$RUNTIME_RECIPE"
          --operator-trust-execution --coordinated-heavy-slot
      - name: Run exactly one original publisher recipe with cold SDK caches
        run: >-
          node scripts/producer-qualification/web-runtime-controller.mjs
          run "$RUNNER_TEMP/web-runtime-inputs/ready-inputs.json" "$RUNNER_TEMP/web-runtime-result"
          --operator-trust-execution --coordinated-heavy-slot
      - name: Retire only the owned derived image
        if: always()
        run: >-
          node scripts/producer-qualification/web-runtime-inputs.mjs
          cleanup "$RUNNER_TEMP/web-runtime-inputs" --operator-trust-execution
      - name: Retain bounded original observations including failures
        if: always()
        run: >-
          python3 scripts/producer-qualification/web-runtime-export.py
          "$RUNNER_TEMP/web-runtime-inputs" "$RUNNER_TEMP/web-runtime-result"
          "$RUNNER_TEMP/web-runtime-observations.zip"
      - name: Upload original runtime observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-web-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-runtime-observations.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
